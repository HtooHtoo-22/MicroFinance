<form [formGroup]="cifForm" (ngSubmit)="onSubmit()" class="max-w-4xl w-full mx-auto p-6 bg-white shadow-md rounded-lg border border-gray-300">
  <!-- Centered "Account Information" Label -->
  <h2 class="text-xl font-bold text-gray-700 mb-4 text-center">Account Information</h2>

  <!-- Full Name and Email -->
  <div class="grid grid-cols-2 gap-4">
      <div>
          <label for="userName" class="block text-sm/6 font-medium text-gray-900">Full Name</label>
          <input type="text" id="userName" formControlName="userName" placeholder="User Name" 
                 class="w-full px-4 p-1 bg-white mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder:text-sm">
      </div>
      <div>
          <label for="email" class="block text-sm/6 font-medium text-gray-900">Email</label>
          <input type="email" id="email" formControlName="email" placeholder="example@gmail.com" 
                 class="w-full px-4 p-1 bg-white mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder:text-sm">
      </div>
  </div>

  <!-- Phone and Gender -->
  <div class="grid grid-cols-2 gap-4 mt-4">
      <div>
        <label for="phone" class="block text-sm/6 font-medium text-gray-900">Phone</label>
        <input type="text" id="phone" formControlName="phone" 
              class="w-full px-4 p-1 bg-white mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 text-sm placeholder:text-sm">
      </div>
      <div>
          <label for="gender" class="block text-sm/6 font-medium text-gray-900">Gender</label>
          <select id="gender" formControlName="gender" 
                  class="w-full px-4 p-1 bg-white border border-gray-300 mt-1 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 text-sm">
              <option value="Male" class="text-sm">MALE</option>
              <option value="Female" class="text-sm">FEMALE</option>
          </select>
      </div>
  </div>

  <!-- State and Township -->
  <div class="grid grid-cols-2 gap-4 mt-4">
      <div>
          <label for="state" class="block text-sm/6 font-medium text-gray-900">State</label>
          <input type="text" id="state" formControlName="state" 
                 class="w-full px-4 p-1 bg-white mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder:text-sm">
      </div>
      <div>
          <label for="township" class="block text-sm/6 font-medium text-gray-900">Township</label>
          <input type="text" id="township" formControlName="township" 
                 class="w-full px-4 p-1 bg-white mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder:text-sm">
      </div>
  </div>

  <!-- Address -->
  <div class="mt-4">
      <label for="address" class="block text-sm/6 font-medium text-gray-900">Address</label>
      <textarea id="address" formControlName="address" 
                class="w-full px-4 p-1 bg-white mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder:text-sm"></textarea>
  </div>

  <!-- NRC Number -->
  <div class="mt-4">
      <label for="NRC" class="block text-sm/6 font-medium text-gray-900">NRC Number</label>
      <input type="text" id="NRC" formControlName="NRC" 
             class="w-full px-4 p-1 bg-white border mt-1 border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder:text-sm">
  </div>

<!-- Front NRC Photo -->
<div class="grid grid-cols-2 gap-4 mt-4">
  <div>
      <div class="col-span-full">
          <label for="front-nrc-photo" class="block text-sm/6 font-medium text-gray-900">Front NRC photo</label>
          <div class="mt-2 flex justify-center rounded-lg border border-dashed border-gray-900/25 px-6 py-10">
            <div class="text-center">
              <svg class="mx-auto size-12 text-gray-300" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" data-slot="icon">
                <path fill-rule="evenodd" d="M1.5 6a2.25 2.25 0 0 1 2.25-2.25h16.5A2.25 2.25 0 0 1 22.5 6v12a2.25 2.25 0 0 1-2.25 2.25H3.75A2.25 2.25 0 0 1 1.5 18V6ZM3 16.06V18c0 .414.336.75.75.75h16.5A.75.75 0 0 0 21 18v-1.94l-2.69-2.689a1.5 1.5 0 0 0-2.12 0l-.88.879.97.97a.75.75 0 1 1-1.06 1.06l-5.16-5.159a1.5 1.5 0 0 0-2.12 0L3 16.061Zm10.125-7.81a1.125 1.125 0 1 1 2.25 0 1.125 1.125 0 0 1-2.25 0Z" clip-rule="evenodd" />
              </svg>
              <div class="mt-4 flex text-sm/6 text-gray-600">
                  <label for="front-nrc-upload" class="relative cursor-pointer rounded-md bg-white font-semibold text-[#00A1FF] focus-within:ring-2 focus-within:ring-indigo-600 focus-within:ring-offset-2 focus-within:outline-hidden hover:text-[#0088CC]">
                    <span>Upload a file</span>
                    <input id="front-nrc-upload" name="frontNRCPhoto" type="file" class="sr-only" (change)="onFileChange($event, 'frontNRCPhoto')">
                  </label>
                <p class="pl-1">or drag and drop</p>
              </div>
              <p class="text-xs/5 text-gray-600">PNG, JPG, GIF up to 10MB</p>
            </div>
          </div>
        </div>
  </div>

    <!-- Back NRC Photo -->
    <div>
      <div class="col-span-full">
          <label for="back-nrc-photo" class="block text-sm/6 font-medium text-gray-900">Back NRC photo</label>
          <div class="mt-2 flex justify-center rounded-lg border border-dashed border-gray-900/25 px-6 py-10">
            <div class="text-center">
              <svg class="mx-auto size-12 text-gray-300" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" data-slot="icon">
                <path fill-rule="evenodd" d="M1.5 6a2.25 2.25 0 0 1 2.25-2.25h16.5A2.25 2.25 0 0 1 22.5 6v12a2.25 2.25 0 0 1-2.25 2.25H3.75A2.25 2.25 0 0 1 1.5 18V6ZM3 16.06V18c0 .414.336.75.75.75h16.5A.75.75 0 0 0 21 18v-1.94l-2.69-2.689a1.5 1.5 0 0 0-2.12 0l-.88.879.97.97a.75.75 0 1 1-1.06 1.06l-5.16-5.159a1.5 1.5 0 0 0-2.12 0L3 16.061Zm10.125-7.81a1.125 1.125 0 1 1 2.25 0 1.125 1.125 0 0 1-2.25 0Z" clip-rule="evenodd" />
              </svg>
              <div class="mt-4 flex text-sm/6 text-gray-600">
                <label for="back-nrc-upload" class="relative cursor-pointer rounded-md bg-white font-semibold text-[#00A1FF] focus-within:ring-2 focus-within:ring-indigo-600 focus-within:ring-offset-2 focus-within:outline-hidden hover:text-[#0088CC]">
                  <span>Upload a file</span>
                  <input id="back-nrc-upload" name="backNRCPhoto" type="file" class="sr-only" (change)="onFileChange($event, 'backNRCPhoto')">
                </label>
                <p class="pl-1">or drag and drop</p>
              </div>
              <p class="text-xs/5 text-gray-600">PNG, JPG, GIF up to 10MB</p>
            </div>
          </div>
      </div>
  </div>
</div>


<!-- User Photo -->
<div class="mt-4">
  <div class="col-span-full">
      <label for="user-photo" class="block text-sm/6 font-medium text-gray-900">User photo</label>
      <div class="mt-2 flex justify-center rounded-lg border border-dashed border-gray-900/25 px-6 py-10">
        <div class="text-center">
          <svg class="mx-auto size-12 text-gray-300" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" data-slot="icon">
            <path fill-rule="evenodd" d="M1.5 6a2.25 2.25 0 0 1 2.25-2.25h16.5A2.25 2.25 0 0 1 22.5 6v12a2.25 2.25 0 0 1-2.25 2.25H3.75A2.25 2.25 0 0 1 1.5 18V6ZM3 16.06V18c0 .414.336.75.75.75h16.5A.75.75 0 0 0 21 18v-1.94l-2.69-2.689a1.5 1.5 0 0 0-2.12 0l-.88.879.97.97a.75.75 0 1 1-1.06 1.06l-5.16-5.159a1.5 1.5 0 0 0-2.12 0L3 16.061Zm10.125-7.81a1.125 1.125 0 1 1 2.25 0 1.125 1.125 0 0 1-2.25 0Z" clip-rule="evenodd" />
          </svg>
          <div class="mt-4 flex text-sm/6 text-gray-600">
            <label for="user-photo-upload" class="relative cursor-pointer rounded-md bg-white font-semibold text-[#00A1FF] focus-within:ring-2 focus-within:ring-indigo-600 focus-within:ring-offset-2 focus-within:outline-hidden hover:text-[#0088CC]">
              <span>Upload a file</span>
              <input id="user-photo-upload" name="userPhoto" type="file" class="sr-only" (change)="onFileChange($event, 'userPhoto')">
            </label>
            <p class="pl-1">or drag and drop</p>
          </div>
          <p class="text-xs/5 text-gray-600">PNG, JPG, GIF up to 10MB</p>
        </div>
      </div>
    </div>
</div>

  <!-- Submit Buttons -->
  <button type="submit" 
  class="w-full mt-6 py-2 px-4 bg-[#00A1FF] text-white font-semibold rounded-md shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all">
Submit
</button>
</form>
