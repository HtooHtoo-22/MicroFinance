<div class="min-h-screen bg-gradient-to-br from-gray-100 to-gray-200 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full">
    <div class="bg-white p-8 shadow-2xl rounded-xl space-y-8">
      <!-- Logo section -->
      <div class="text-center">
        <img [src]="imagePath" class="mx-auto w-40 h-20 object-contain">
        <h2 class="mt-6 text-3xl font-extrabold text-[#00A1FF]">
          Welcome Back
        </h2>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Error message -->
        <div *ngIf="errorMessage" class="bg-red-50 text-red-500 p-3 rounded-md text-sm">
          {{ errorMessage }}
        </div>

        <!-- Username field -->
        <div class="space-y-2">
          <label for="username" class="block text-sm font-medium text-gray-700">Email address or User ID</label>
          <div class="relative">
            <input id="username" type="text" formControlName="username" 
              autocomplete="username" 
              class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition-all duration-200 placeholder:text-gray-400"
              [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"/>
          </div>
          <div class="text-red-500 text-xs" *ngIf="loginForm.get('username')?.errors?.['required'] && loginForm.get('username')?.touched">
            Username is required
          </div>
        </div>

        <!-- Password field -->
        <div class="space-y-2">
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <div class="relative">
            <input id="password" type="password" formControlName="password" 
              autocomplete="current-password" 
              class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition-all duration-200 placeholder:text-gray-400"
              [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"/>
          </div>
          <div class="text-red-500 text-xs" *ngIf="loginForm.get('password')?.errors?.['required'] && loginForm.get('password')?.touched">
            Password is required
          </div>
        </div>

        <!-- Forgot password link -->
        <div class="flex items-center justify-start">
          <a href="#" class="text-sm font-medium text-[#00A1FF] hover:text-blue-500 transition-colors duration-200">
            Forgot password?
          </a>
        </div>

        <!-- Submit button -->
        <button type="submit" 
          class="w-full py-3 px-4 bg-[#00A1FF] text-white font-medium rounded-lg shadow-lg hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-2 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
          [disabled]="loginForm.invalid || loading">
          <span class="flex items-center justify-center">
            <svg *ngIf="loading" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            {{ loading ? 'Logging in...' : 'Sign in' }}
          </span>
        </button>
      </form>
    </div>
  </div>
</div>
