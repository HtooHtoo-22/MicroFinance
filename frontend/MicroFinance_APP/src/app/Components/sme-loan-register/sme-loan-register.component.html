<div class="min-h-screen bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-3xl mx-auto p-8 bg-white shadow-xl rounded-xl">
    <h2 class="text-3xl font-bold mb-8 text-center text-[#00A1FF]">SME Loan Register</h2>
    <form [formGroup]="smeLoanForm" (ngSubmit)="onSubmit()" class="space-y-6">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-2">
          <label for="currentAccountaccId" class="block text-sm font-semibold text-gray-700">Current Account ID</label>
          <input id="currentAccountaccId" formControlName="currentAccountaccId" type="text"
                 class="w-full px-4 py-1 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-[#00A1FF] focus:border-transparent transition duration-200">
          <div *ngIf="smeLoanForm.get('currentAccountaccId')?.invalid && smeLoanForm.get('currentAccountaccId')?.touched" class="text-red-500 text-sm">
            Current Account ID is required.
          </div>
          <ul *ngIf="filteredAccounts.length > 0" class="absolute bg-white border border-gray-300 rounded-lg mt-1 z-10">
            <li *ngFor="let account of filteredAccounts" class="px-4 py-2 hover:bg-gray-100 cursor-pointer" (click)="selectAccount(account)">
              {{ account.accountId }}
            </li>
          </ul>
        </div>

        <!-- Loan Amount -->
        <div class="space-y-2">
          <label for="loanAmount" class="block text-sm font-semibold text-gray-700">Loan Amount</label>
          <input id="loanAmount" formControlName="loanAmount" type="number"
                 class="w-full px-4 py-1 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-[#00A1FF] focus:border-transparent transition duration-200">
          <div *ngIf="smeLoanForm.get('loanAmount')?.invalid && smeLoanForm.get('loanAmount')?.touched" class="text-red-500 text-sm">
            Loan amount is required and must be a valid number.
          </div>
        </div>

        <!-- Interest Rate -->
        <div class="space-y-2">
          <label for="rateValue" class="block text-sm font-semibold text-gray-700">SME Loan Annual Interest Rate</label>
          <div class="relative">
            <input id="rateValue" type="number" [value]="rateValue" readonly
                   class="w-full px-4 py-1 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-[#00A1FF] focus:border-transparent transition duration-200 pr-10">
            <span class="absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-500">%</span> <!-- Percentage sign -->
          </div>
        </div>
      </div>

      <!-- Grace Period and Loan Purpose -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-2">
          <label for="gracePeriod" class="block text-sm font-semibold text-gray-700">Grace Period (Optional)</label>
          <input id="gracePeriod" formControlName="gracePeriod" type="number"
                 class="w-full px-4 py-1 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-[#00A1FF] focus:border-transparent transition duration-200">
        </div>
      </div>

      <div class="space-y-2">
        <label for="loanPurpose" class="block text-sm font-semibold text-gray-700">Loan Purpose</label>
        <textarea id="loanPurpose" formControlName="loanPurpose" rows="3"
        class="w-full p-1 bg-white mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder:text-sm"></textarea>
      </div>

      <!-- Document Fee and Service Charge -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-2">
          <label for="documentFee" class="block text-sm font-semibold text-gray-700">Document Fee</label>
          <input id="documentFee" formControlName="documentFee" type="number"
                 class="w-full px-4 py-1 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-[#00A1FF] focus:border-transparent transition duration-200">
        </div>

        <div class="space-y-2">
          <label for="serviceCharge" class="block text-sm font-semibold text-gray-700">
            Service Charge ({{ serviceChargeValue }}%) of Loan Amount
          </label>
          <input id="serviceCharge" formControlName="serviceCharge" type="number"
                 class="w-full px-4 py-1 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-[#00A1FF] focus:border-transparent transition duration-200">
        </div>
      </div>

      <!-- Duration and Principal -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-2">
          <label for="duration" class="block text-sm font-semibold text-gray-700">Duration (Months)</label>
          <input id="duration" formControlName="duration" type="number"
                 class="w-full px-4 py-1 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-[#00A1FF] focus:border-transparent transition duration-200">
          <div *ngIf="smeLoanForm.get('duration')?.invalid && smeLoanForm.get('duration')?.touched" class="text-red-500 text-sm">
            Duration is required and must be a valid number.
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <div class="text-center pt-6">
        <button type="submit" [disabled]="!smeLoanForm.valid" class="w-full mt-1 py-2 px-4 bg-[#00A1FF] text-white font-semibold rounded-md shadow-md hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all">
          Submit
        </button>
      </div>
    </form>
  </div>
</div>
