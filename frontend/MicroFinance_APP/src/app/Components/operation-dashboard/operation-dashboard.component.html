<div class="flex">
  <!-- Sidebar -->
  <div class="sidebar w-64 bg-white h-screen fixed top-0 left-0 p-6 shadow-lg overflow-y-auto">
    <img [src]="imagePath" class="w-34 h-16 object-contain mb-6">
    <ul class="space-y-4 text-gray-900 text-sm font-semibold">
      <li class="flex items-center space-x-3 hover:bg-gray-100 p-2 rounded-lg transition duration-200">
        <img src="https://cdn0.iconfinder.com/data/icons/set-app-incredibles/24/Home-01-512.png" class="w-5 h-5">
        <a [routerLink]="['/operation-dashboard/home']" routerLinkActive="text-[#00A1FF]">Home</a>
      </li>

      <!-- Customer Management -->
      <li *ngIf="isEntry() || isOperation()" class="flex items-center space-x-3 hover:bg-gray-100 p-2 rounded-lg transition duration-200">
        <img src="https://cdn2.iconfinder.com/data/icons/e-commerce-line-4-1/1024/user4-512.png" class="w-5 h-5">
        <a [routerLink]="['/operation-dashboard/hp-register']" routerLinkActive="text-[#00A1FF]">HP Loan Register</a>
      </li>
      <li *ngIf="isEntry() || isOperation()" class="flex items-center space-x-3 hover:bg-gray-100 p-2 rounded-lg transition duration-200">
        <img src="https://cdn1.iconfinder.com/data/icons/social-productivity-line-art-6/128/profile-menu-ol-1024.png" class="w-5 h-5">
        <a [routerLink]="['/operation-dashboard/sme-loan-register']" routerLinkActive="text-[#00A1FF]">SME Loan Register</a>
      </li>
      <li *ngIf="isEntry() || isOperation()" class="flex items-center space-x-3 hover:bg-gray-100 p-2 rounded-lg transition duration-200">
        <img src="https://cdn3.iconfinder.com/data/icons/fluent-regular-24px-vol-4/24/ic_fluent_history_24_regular-1024.png" class="w-5 h-5">
        <a [routerLink]="['/operation-dashboard/hp-loan-list-finished']" routerLinkActive="text-[#00A1FF]">APPROVE HP LOANS</a>
      </li>
      <li *ngIf="isAdmin() || isEntry() || isManager() || isOperation()" class="flex items-center space-x-3 hover:bg-gray-100 p-2 rounded-lg transition duration-200">
        <img src="https://cdn3.iconfinder.com/data/icons/fluent-regular-24px-vol-4/24/ic_fluent_history_24_regular-1024.png" class="w-5 h-5">
        <a [routerLink]="['/operation-dashboard/sme-approve-loan-list/']" routerLinkActive="text-[#00A1FF]">Approve SME Loans</a>
      </li>
    </ul>
  </div>

     <!-- Main content wrapper -->
     <div class="flex-1 justify-between ml-64">
      <header class="fixed right-0 left-64 bg-white z-10 shadow-md p-4 flex justify-between items-center">
        <!-- Left side content -->
        <div class="flex items-center space-x-2">
          <span class="font-medium text-gray-700">Manager Dashboard</span>
        </div>
      
        <!-- Right side content -->
        <div class="flex items-center space-x-4">
          <div *ngIf="getCurrentRole()" class="text-right">
            <div class="text-sm font-medium text-gray-700">
              {{ getCurrentRoleName() }}
            </div>
            <div *ngIf="getCurrentEmail()" class="text-xs text-gray-500">
              {{ getCurrentEmail() }}
            </div>
          </div>
          <button (click)="openLogoutModal()" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition duration-200">
            <span>Logout</span>
          </button>
        </div>
      </header>
    
      <div class="pt-20 p-7 bg-gray-100 min-h-screen">
        <router-outlet></router-outlet>
      </div>
    </div>
</div>
<!-- Logout Modal -->
<div *ngIf="showLogoutModal" class="fixed inset-0 bg-white-/70 backdrop-blur-[1.5px] flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-lg shadow-lg p-6 w-96">
    <h2 class="text-2xl font-semibold text-blue-800 mb-4">Confirm Logout</h2>
    <p class="text-gray-700 mb-6">Are you sure you want to logout?</p>
    <div class="flex justify-end space-x-4">
      <button (click)="closeLogoutModal()" class="px-4 py-2 bg-gray-200 text-black rounded-lg hover:bg-gray-300 transition duration-200">
        Cancel
      </button>
      <button (click)="confirmLogout()" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition duration-200">
        Logout
      </button>
    </div>
  </div>
</div>
