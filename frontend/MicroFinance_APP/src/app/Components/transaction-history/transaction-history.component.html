<div class="container mx-auto px-4 py-8">
    <h2 class="text-2xl font-bold mb-6 text-[#00A1FF]">Transaction List</h2>
  
    <!-- Loading State -->
    <div *ngIf="loading" class="flex flex-col items-center justify-center py-8">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
      <p class="mt-4 text-gray-600">Loading transactions...</p>
    </div>
  
    <!-- Error State -->
    <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
      <span class="block sm:inline">{{ errorMessage }}</span>
      <button class="absolute top-0 bottom-0 right-0 px-4" (click)="errorMessage = null">
        <span class="sr-only">Close</span>
        <svg class="h-6 w-6" stroke="currentColor" fill="none" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  
    <!-- Success State -->
    <div *ngIf="!loading && !errorMessage" class="overflow-x-auto bg-white rounded-lg shadow">
      <table class="min-w-full table-auto">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Account ID</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Amount</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <tr *ngFor="let transaction of transactions" class="hover:bg-gray-50">
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ transaction.currentAccountId }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ transaction.type }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ transaction.amount }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ transaction.date | date:'dd MMM yyyy'}}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-2 flex">
              <button class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md text-sm transition duration-150 ease-in-out">
                View
              </button>
              <button class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md text-sm transition duration-150 ease-in-out">
                Delete
              </button>
            </td>
          </tr>
          <tr *ngIf="transactions.length === 0">
            <td colspan="6" class="px-6 py-8 text-center text-gray-500">
              No transactions found
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
