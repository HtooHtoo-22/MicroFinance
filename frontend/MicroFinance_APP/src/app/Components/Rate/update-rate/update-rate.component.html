<a routerLink="/dashboard/list-rate" class="btn btn-primary">Rate List</a>

<div class="container mx-auto p-4">
  <form (ngSubmit)="updateRate()" #editRateForm="ngForm" class="max-w-md mx-auto">
    <div class="mb-4">
      <label for="rateType" class="block mb-2">Rate Type:</label>
      <input 
        type="text" 
        id="rateType" 
        name="rateType" 
        [(ngModel)]="rate.rateType" 
        required
        class="w-full p-2 border rounded">
    </div>
    <div class="mb-4">
      <label for="value" class="block mb-2">Value:</label>
      <input 
        type="number" 
        id="value" 
        name="value" 
        [(ngModel)]="rate.value" 
        required
        class="w-full p-2 border rounded">
    </div>
    
    <button 
      type="submit" 
      [disabled]="editRateForm.invalid"
      class="bg-blue-500 text-white px-4 py-2 rounded disabled:bg-gray-400">
      Update Rate
    </button>
  </form>
</div>
