<div class="container mx-auto p-4 max-w-7xl">
    <!-- ... (keep header section unchanged) ... -->
    <div class="container mx-auto p-4 max-w-7xl">
        <!-- Sorting Dropdown -->
        <div class="flex justify-between items-center mb-8">
          <h2 class="text-2xl font-bold text-gray-800">Collateral Management</h2>
          <div class="relative w-48">
            <select 
              [(ngModel)]="selectedCollateralType" 
              (change)="sortByCollateralType()"
              class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 text-gray-600 transition-colors appearance-none"
            >
              <option value="">All Collateral Types</option>
              <option *ngFor="let type of collateralTypes" [value]="type">
                {{ type }}
              </option>
            </select>
            <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>
          </div>
        </div>
    <!-- Collateral Cards Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"> <!-- Reduced gap -->
      <div 
        *ngFor="let collateral of filteredCollaterals" 
        class="bg-white rounded-xl shadow-sm hover:shadow-lg transition-shadow duration-300 border border-gray-100 overflow-hidden"
      >
        <!-- Collateral Image -->
        <div class="relative h-40 bg-gradient-to-r from-blue-50 to-indigo-50"> <!-- Reduced height -->
          <img 
            [src]="collateral.image || 'assets/default-image.jpg'" 
            class="w-full h-full object-cover"
            alt="Collateral Image"
          />
          <span class="absolute top-3 right-3 px-2.5 py-1 rounded-full bg-white/90 backdrop-blur text-sm font-medium text-gray-600 shadow-sm">
            {{ collateral.collateralTypeName }}
          </span>
        </div>
  
        <div class="p-4"> <!-- Reduced padding -->
          <div class="flex items-center justify-between mb-3"> <!-- Reduced margin -->
            <div>
              <h3 class="text-[15px] font-semibold text-gray-800">Owner : {{ collateral.ownerName }}</h3>
              <p class="text-xs text-gray-500 mt-0.5">CIF: {{ collateral.cifId }}</p>
            </div>
          </div>
  
          <!-- Value Cards -->
          <div class="grid grid-cols-2 gap-2 mb-3"> <!-- Reduced gap and margin -->
            <div class="p-2.5 bg-gray-50 rounded-lg"> <!-- Reduced padding -->
              <p class="text-xs font-medium text-gray-500 mb-1">Original Value</p>
              <p class="text-[13px] font-semibold text-blue-600">{{ collateral.value | currency }}</p>
            </div>
            <div class="p-2.5 bg-gray-50 rounded-lg">
              <p class="text-xs font-medium text-gray-500 mb-1">Remaining Value</p>
              <p 
                class="text-[13px] font-semibold"
                [ngClass]="collateral.remainingValue > 0 ? 'text-green-600' : 'text-red-600'"
              >
                {{ collateral.remainingValue | currency }}
              </p>
            </div>
          </div>
  
          <!-- Loan Associations -->
          <div class="border-t pt-3"> <!-- Reduced padding -->
            <p class="text-xs font-medium text-gray-500 mb-1.5">Associated Loans</p>
            <div *ngIf="collateral.smeLoanIds.length > 0; else noLoans" class="flex flex-wrap gap-1.5">
              <span 
                *ngFor="let loanId of collateral.smeLoanIds"
                class="px-2 py-1 bg-indigo-50 text-indigo-700 rounded-full text-[11px] font-medium"
              >
                #{{ loanId }}
              </span>
            </div>
            <ng-template #noLoans>
              <p class="text-xs text-gray-400 italic">No associated loans</p>
            </ng-template>
          </div>
  
          <!-- Compact View Details Button -->
          <button 
            (click)="viewDetails(collateral.id)"
            class="mt-3 w-full flex items-center justify-center gap-1.5 px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium transition-colors"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            View Details
          </button>
        </div>
      </div>
    </div>
  </div>
