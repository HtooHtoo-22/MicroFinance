<div class="container mx-auto p-6">
  <h2 class="text-[#00A1FF] text-2xl font-bold mb-6">Dealers Accounts</h2>

  <div class="flex justify-end space-x-4 mb-4">
    <button (click)="downloadCSV()" class="px-4 py-2 bg-green-500 text-white rounded-md hover:bg-green-600">
      Download CSV
    </button>
    <button (click)="downloadPDF()" class="px-4 py-2 bg-red-500 text-white rounded-md hover:bg-red-600">
      Download PDF
    </button>
  </div>


  <!-- Loading State -->
  <div *ngIf="loading" class="flex flex-col items-center justify-center py-8">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
    <p class="mt-4 text-gray-600">Loading dealers...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
    <span class="block sm:inline">{{ errorMessage }}</span>
    <button class="absolute top-0 bottom-0 right-0 px-4" (click)="errorMessage = null">
      <span class="sr-only">Close</span>
      <svg class="h-6 w-6" stroke="currentColor" fill="none" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Success State -->
  <div *ngIf="!loading && !errorMessage" class="space-y-4">
    <div *ngFor="let dealer of paginatedDealers" 
         class="bg-white rounded-lg p-4 shadow-sm hover:shadow-md transition-shadow duration-300 cursor-pointer"
         (click)="viewDetails(dealer.id)">
      <div class="flex items-center gap-4">
        <!-- User Photo -->
        <div class="flex-shrink-0">
          <div class="relative">
            <img *ngIf="dealer.userPhotoURL; else placeholder" 
                 [src]="dealer.userPhotoURL" 
                 alt="User photo"
                 class="w-12 h-12 rounded-full object-cover border-2 border-[#00A1FF]">
            <ng-template #placeholder>
              <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center">
                <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
              </div>
            </ng-template>
          </div>
        </div>

        <!-- Business Info -->
        <div class="flex-1 min-w-0">
          <h3 class="text-lg font-semibold text-gray-800 truncate">{{ dealer.businessName }}</h3>
          <div class="flex items-center gap-4 mt-1 text-sm text-gray-600">
            <div class="flex items-center">
              <svg class="w-4 h-4 mr-1.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
              </svg>
              <span class="truncate">{{ dealer.phone }}</span>
            </div>
            <div class="flex items-center">
              <svg class="w-4 h-4 mr-1.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
              </svg>
              <span class="truncate">{{ dealer.registerDate | date: 'mediumDate' }}</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Add this section at the bottom of the card -->
      <div class="mt-3 border-t pt-3">
        <div class="flex items-center justify-between text-sm">
          <div class="flex items-center text-blue-600 hover:text-blue-800"
               (click)="viewDetails(dealer.id); $event.stopPropagation()">
            <span>View Details</span>
            <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"/>
            </svg>
          </div>
          <span class="px-2 py-1 rounded-full text-xs font-medium"
                [ngClass]="{
                  'bg-green-100 text-green-800': dealer.status === 'ACTIVE',
                  'bg-red-100 text-red-800': dealer.status === 'REJECTED',
                  'bg-yellow-100 text-yellow-800': dealer.status === 'PENDING'
                }">
            {{ dealer.status }}
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- Pagination Controls -->
  <div class="px-6 py-4 bg-gray-50 border-t border-gray-200">
    <div class="flex items-center justify-between">
      <!-- Items per page info -->
      <div class="text-sm text-gray-700">
        Showing <span class="font-medium">{{ startIndex }}</span> to <span class="font-medium">{{ endIndex }}</span> of
        <span class="font-medium">{{ totalDealers }}</span> results
      </div>

      <!-- Pagination buttons -->
      <div class="flex items-center space-x-2">
        <button 
          (click)="previousPage()" 
          [disabled]="currentPage === 1"
          class="px-3 py-1 rounded-md text-sm font-medium"
          [ngClass]="currentPage === 1 ? 'bg-gray-200 text-gray-500 cursor-not-allowed' : 'bg-white text-blue-500 hover:bg-blue-50 border border-gray-300'">
          Previous
        </button>

        <div class="flex space-x-1">
          <button *ngFor="let page of pages" 
            (click)="goToPage(page)"
            class="px-3 py-1 rounded-md text-sm font-medium"
            [ngClass]="currentPage === page ? 'bg-blue-500 text-white' : 'bg-white text-gray-500 hover:bg-blue-50 border border-gray-300'">
            {{ page }}
          </button>
        </div>

        <button 
          (click)="nextPage()" 
          [disabled]="currentPage === totalPages"
          class="px-3 py-1 rounded-md text-sm font-medium"
          [ngClass]="currentPage === totalPages ? 'bg-gray-200 text-gray-500 cursor-not-allowed' : 'bg-white text-blue-500 hover:bg-blue-50 border border-gray-300'">
          Next
        </button>
      </div>
    </div>
  </div>
</div>
