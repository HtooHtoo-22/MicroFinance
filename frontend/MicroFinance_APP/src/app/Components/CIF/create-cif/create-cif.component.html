<div class="container mx-auto px-4 py-8 max-w-2xl">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">{{ isEditMode ? 'Update CIF' : 'Create CIF' }}</h2>
    <form [formGroup]="cifForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data" class="space-y-6">
  
      <div class="mb-4">
        <label for="userName" class="block text-gray-700 text-sm font-bold mb-2">User Name</label>
        <input id="userName" formControlName="userName" required 
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"/>
      </div>
  
      <div class="mb-4">
        <label for="gender" class="block text-gray-700 text-sm font-bold mb-2">Gender</label>
        <select id="gender" formControlName="gender" required 
          class="w-full px-4 py-2 bg-white border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400">
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </div>
  
      <div class="mb-4">
        <label for="job" class="block text-gray-700 text-sm font-bold mb-2">Job</label>
        <input id="job" formControlName="job" required 
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"/>
      </div>
  
      <div class="mb-4">
        <label for="incomeAmount" class="block text-gray-700 text-sm font-bold mb-2">Income Amount</label>
        <input id="incomeAmount" type="number" formControlName="incomeAmount" required 
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"/>
      </div>
  
      <div class="mb-4">
        <label for="nrc" class="block text-gray-700 text-sm font-bold mb-2">NRC</label>
        <input id="nrc" formControlName="nrc" required 
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"/>
      </div>
  
      <div class="mb-4">
        <label for="phone" class="block text-gray-700 text-sm font-bold mb-2">Phone</label>
        <input id="phone" formControlName="phone" required 
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"/>
      </div>
  
      <div class="mb-4">
        <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email</label>
        <input id="email" type="email" formControlName="email" required 
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"/>
      </div>
  
      <div class="mb-4">
        <label for="state" class="block text-gray-700 text-sm font-bold mb-2">State</label>
        <input id="state" formControlName="state" required 
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"/>
      </div>
  
      <div class="mb-4">
        <label for="township" class="block text-gray-700 text-sm font-bold mb-2">Township</label>
        <input id="township" formControlName="township" required 
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"/>
      </div>
  
      <div class="mb-4">
        <label for="address" class="block text-gray-700 text-sm font-bold mb-2">Address</label>
        <input id="address" formControlName="address" required 
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"/>
      </div>
  
      <!-- Branch Selection -->
      <div class="mb-4">
        <label for="branchId" class="block text-gray-700 text-sm font-bold mb-2">Branch</label>
        <select
        class="w-full px-4 p-1 bg-white mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 text-sm placeholder:text-sm"
          [ngClass]="{'border-red-500': submitted && branchIdControl?.invalid}"
          id="branchId"
          formControlName="branchId"
        >
          <option *ngFor="let branch of branches" [value]="branch.id">
            {{ branch.name }}
          </option>
        </select>
        <div class="text-red-500 text-sm mt-1" *ngIf="submitted && branchIdControl?.invalid">
          Please select a branch
        </div>
      </div>
  
      <div class="mb-4">
        <label for="frontNRC" class="block text-gray-700 text-sm font-bold mb-2">Front NRC Photo</label>
        <input id="frontNRC" type="file" (change)="onFileSelected($event, 'frontNRC')" required 
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
      </div>
  
      <div class="mb-4">
        <label for="backNRC" class="block text-gray-700 text-sm font-bold mb-2">Back NRC Photo</label>
        <input id="backNRC" type="file" (change)="onFileSelected($event, 'backNRC')" required 
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
      </div>
  
      <div class="mb-4">
        <label for="userPhoto" class="block text-gray-700 text-sm font-bold mb-2">User Photo</label>
        <input id="userPhoto" type="file" (change)="onFileSelected($event, 'userPhoto')" required 
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
      </div>
  
      <button type="submit" [disabled]="cifForm.invalid"
        class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-opacity-50 disabled:opacity-50 disabled:cursor-not-allowed">
        {{ isEditMode ? 'Update' : 'Create' }} CIF
      </button>
    </form>
  </div>
