<div class="container mx-auto px-4 py-8">
  <h2 class="text-2xl font-bold mb-6 text-[#00A1FF]">List of CIFs</h2>


  <div class="overflow-x-auto bg-white rounded-lg shadow">
    <table class="min-w-medium table-auto">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">CIF ID</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Gender</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Income Amount</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">State</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let cif of paginatedUsers" class="hover:bg-gray-50">
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
            {{ cif.cifId }}
            <span *ngIf="!cif.hasCurrentAccount" class="ml-2 px-2 py-1 bg-red-100 text-red-800 text-xs rounded-full">
             No Account
            </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium capitalize"
                  [ngClass]="cif.gender === 'Male' ? 'bg-blue-100 text-blue-800' : 'bg-pink-100 text-pink-800'">
              {{ cif.gender }}
            </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
            {{ cif.incomeAmount | currency:'USD':'symbol':'1.0-0' }}
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                  [ngClass]="cif.state === 'Active' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'">
              {{ cif.state }}
            </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-2 flex">
            <a [routerLink]="['/entry-dashboard/updated-cif', cif.id]"
               class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md text-sm transition duration-150 ease-in-out shadow-sm">
              Update
            </a>
            <a *ngIf="!cif.hasCurrentAccount" 
               [routerLink]="['/entry-dashboard/create-current-account', cif.id]"
               class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-md text-sm transition duration-150 ease-in-out shadow-sm flex items-center">
              <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
              </svg>
              Create Account
            </a>
            <a [routerLink]="['/entry-dashboard/cif-detail-view', cif.id]"
               class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded-md text-sm transition duration-150 ease-in-out shadow-sm">
              View
            </a>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Add Pagination Controls -->
    <div class="px-6 py-4 bg-gray-50 border-t border-gray-200">
      <div class="flex items-center justify-between">
        <!-- Items per page info -->
        <div class="text-sm text-gray-700">
          Showing <span class="font-medium">{{ startIndex }}</span> to <span class="font-medium">{{ endIndex }}</span> of
          <span class="font-medium">{{ totalUsers }}</span> results
        </div>

        <!-- Pagination buttons -->
        <div class="flex items-center space-x-2">
          <button 
            (click)="previousPage()" 
            [disabled]="currentPage === 1"
            class="px-3 py-1 rounded-md text-sm font-medium"
            [ngClass]="currentPage === 1 ? 'bg-gray-200 text-gray-500 cursor-not-allowed' : 'bg-white text-blue-500 hover:bg-blue-50 border border-gray-300'">
            Previous
          </button>

          <div class="flex space-x-1">
            <button *ngFor="let page of pages" 
              (click)="goToPage(page)"
              class="px-3 py-1 rounded-md text-sm font-medium"
              [ngClass]="currentPage === page ? 'bg-blue-500 text-white' : 'bg-white text-gray-500 hover:bg-blue-50 border border-gray-300'">
              {{ page }}
            </button>
          </div>

          <button 
            (click)="nextPage()" 
            [disabled]="currentPage === totalPages"
            class="px-3 py-1 rounded-md text-sm font-medium"
            [ngClass]="currentPage === totalPages ? 'bg-gray-200 text-gray-500 cursor-not-allowed' : 'bg-white text-blue-500 hover:bg-blue-50 border border-gray-300'">
            Next
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
