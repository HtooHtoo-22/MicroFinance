<div class="navbar">
    <!-- Example navigation bar -->
    <a routerLink="/list-role">List Roles</a>
    <a routerLink="/create-role">Create Role</a>
  </div>
  
  <div class="container">
    <h2>Edit Role</h2>
    <form (ngSubmit)="updateRole()" #editRoleForm="ngForm">
      <div>
        <label for="roleName">Role Name:</label>
        <input 
          type="text" 
          id="roleName" 
          name="roleName" 
          [(ngModel)]="role.roleName" 
          required>
      </div>
      <div>
        <label for="roleDescription">Description:</label>
        <input 
          type="text" 
          id="roleDescription" 
          name="roleDescription" 
          [(ngModel)]="role.roleDescription" 
          required>
      </div>
      <div>
        <label for="active">Active:</label>
        <input 
          type="checkbox" 
          id="active" 
          name="active" 
          [(ngModel)]="role.active">
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Permissions</label>
        <div class="grid grid-cols-2 gap-4">
          <div *ngFor="let perm of allPermissions" class="flex items-center">
            <input type="checkbox" 
                   [id]="perm" 
                   [checked]="selectedPermissions.includes(perm)"
                   (change)="togglePermission(perm)"
                   class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
            <label [for]="perm" class="ml-2 text-sm text-gray-700">{{ perm }}</label>
          </div>
        </div>
      </div>

      <button type="submit" [disabled]="editRoleForm.invalid">Update Role</button>
    </form>
  </div>
