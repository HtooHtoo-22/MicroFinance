

<div class="container mx-auto px-4 py-8">
  <h2 class="text-2xl font-bold text-blue-800 mb-6">Edit Role</h2>
  <form (ngSubmit)="updateRole()" #editRoleForm="ngForm" class="bg-white p-6 rounded-lg shadow-md">
    <div class="mb-4">
      <label for="roleName" class="block text-sm font-medium text-gray-700 mb-2">Role Name:</label>
      <input 
        type="text" 
        id="roleName" 
        name="roleName" 
        [(ngModel)]="role.roleName" 
        required
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div class="mb-4">
      <label for="roleDescription" class="block text-sm font-medium text-gray-700 mb-2">Description:</label>
      <input 
        type="text" 
        id="roleDescription" 
        name="roleDescription" 
        [(ngModel)]="role.roleDescription" 
        required
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div class="mb-4">
      <label for="active" class="block text-sm font-medium text-gray-700 mb-2">Active:</label>
      <input 
        type="checkbox" 
        id="active" 
        name="active" 
        [(ngModel)]="role.active"
        class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-2">Permissions</label>
      <div class="grid grid-cols-2 gap-4">
        <div *ngFor="let perm of allPermissions" class="flex items-center">
          <input type="checkbox" 
                 [id]="perm" 
                 [checked]="selectedPermissions.includes(perm)"
                 (change)="togglePermission(perm)"
                 class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
          <label [for]="perm" class="ml-2 text-sm text-gray-700">{{ perm }}</label>
        </div>
      </div>
    </div>

    <button type="submit" [disabled]="editRoleForm.invalid" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition duration-200">
      Update Role
    </button>
  </form>
</div>
