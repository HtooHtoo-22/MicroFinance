<div class="container mx-auto px-4 py-8">
  <!-- Page Title -->
  <title>Role List</title>
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-[#00A1FF]">Role List</h2>
  </div>


  <!-- Role Table -->
  <div class="overflow-x-auto bg-white rounded-lg shadow">
    <table class="min-w-full table-auto">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Role Name</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let r of pagedRoles" class="hover:bg-gray-50">
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ r.roleName }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ r.roleDescription }}</td>
        </tr>

        <!-- Empty State -->
        <tr *ngIf="roles.length === 0">
          <td colspan="4" class="px-6 py-8 text-center text-gray-500">
            No roles found
          </td>
        </tr>
        
      </tbody>
    </table>
   <!-- Add Pagination Controls -->
   <div class="px-6 py-4 bg-gray-50 border-t border-gray-200">
    <div class="flex items-center justify-between">
      <!-- Items per page info -->
      <div class="text-sm text-gray-700">
        Showing <span class="font-medium">{{pageSize + 1 }}</span> to <span class="font-medium">{{ currentPage }}</span> of
        <span class="font-medium">{{ totalRoles }}</span> results
      </div>

    

           <!-- Pagination buttons -->
           <div class="flex items-center space-x-2">
            <button 
              (click)="previousPage()" 
              [disabled]="currentPage === 1"
              class="px-3 py-1 rounded-md text-sm font-medium"
              [ngClass]="currentPage === 1 ? 'bg-gray-200 text-gray-500 cursor-not-allowed' : 'bg-white text-blue-500 hover:bg-blue-50 border border-gray-300'">
              Previous
            </button>

            <div class="flex space-x-1">
              <button *ngFor="let page of pages" 
                (click)="goToPage(page)"
                class="px-3 py-1 rounded-md text-sm font-medium"
                [ngClass]="currentPage === page ? 'bg-blue-500 text-white' : 'bg-white text-gray-500 hover:bg-blue-50 border border-gray-300'">
                {{ page }}
              </button>
            </div>

            <button 
            (click)="nextPage()" 
            [disabled]="currentPage === pages.length"
            class="px-3 py-1 rounded-md text-sm font-medium"
            [ngClass]="currentPage === pages.length ? 'bg-gray-200 text-gray-500 cursor-not-allowed' : 'bg-white text-blue-500 hover:bg-blue-50 border border-gray-300'">
            Next
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
