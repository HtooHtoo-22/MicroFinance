<div class="container max-w-xl w-full mt-32 mx-auto p-6 bg-white shadow-md rounded-lg">
  <h2 class="text-2xl font-bold mb-6 text-[#00A1FF]">Create Role</h2>

  <form [formGroup]="roleForm" (ngSubmit)="createRole()">
    <div class="mb-4">
      <label for="roleName" class="block text-sm font-medium text-gray-700">Role Name</label>
      <input id="roleName" formControlName="roleName" type="text"  class="w-full p-1 bg-white mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" required>
    </div>

    <div class="mb-4">
      <label for="roleDescription" class="block text-sm font-medium text-gray-700">Role Description</label>
      <input id="roleDescription" formControlName="roleDescription" type="text"  class="w-full p-1 bg-white mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" required>
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-2">Permissions</label>
      <div class="grid grid-cols-2 gap-4">
        <div *ngFor="let perm of allPermissions" class="flex items-center">
          <input type="checkbox" 
                 [id]="perm" 
                 [value]="perm" 
                 (change)="togglePermission(perm)"
                 class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
          <label [for]="perm" class="ml-2 text-sm text-gray-700">{{ perm}}</label>
        </div>
      </div>
    </div>

    <div class="flex justify-end">
      <button type="submit" class="btn btn-primary bg-[#00A1FF] text-white px-4 py-2 rounded-md hover:bg-blue-600 transition" [disabled]="roleForm.invalid">Create Role</button>
    </div>
  </form>

  <!-- Success Alert -->
  <div id="successModal" *ngIf="showSuccessModal" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 w-full max-w-md">
    <div class="relative p-4 bg-white rounded-lg shadow-md border border-green-300">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 rounded-full bg-green-100 p-2 flex items-center justify-center">
            <svg class="w-5 h-5 text-green-500" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
            </svg>
          </div>
          <p class="text-sm font-semibold text-gray-900">Role created successfully!</p>
        </div>
        <button (click)="closeModal()" class="text-gray-400 hover:text-gray-900">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
