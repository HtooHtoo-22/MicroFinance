<div class="max-w-md mx-auto mt-16 bg-white p-6 rounded-lg shadow-lg">
    <h2 class="text-xl font-semibold text-center text-gray-800 mb-4">{{ isEditing ? 'Edit Product' : 'Create Product' }}</h2>
  
    <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
      {{ errorMessage }}
    </div>
  
    <!-- Loading Indicator -->
    <div *ngIf="loading" class="flex items-center justify-center py-8">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
    </div>
  
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <!-- Product Name -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Product Name:</label>
        <input type="text" formControlName="productName" class="w-full p-1 bg-white mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" required />
        <div *ngIf="productForm.get('productName')?.invalid && productForm.get('productName')?.touched" class="text-red-500 text-xs">
          Product name is required.
        </div>
      </div>
  
      <!-- Value -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Value:</label>
        <input type="number" formControlName="value" class="w-full p-1 bg-white mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" required />
        <div *ngIf="productForm.get('value')?.invalid && productForm.get('value')?.touched" class="text-red-500 text-xs">
          Value must be a positive number.
        </div>
      </div>
  
      <!-- Photo -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Photo:</label>
        <input type="file" (change)="onFileSelected($event)" accept="image/*" class="w-full p-1 bg-white mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" />
        <img *ngIf="previewImage" [src]="previewImage" alt="Preview" class="mt-2 w-24 h-24 object-cover" />
      </div>
  
      <!-- Submit Button -->
      <button type="submit" class="w-full mt-2 py-2 px-4 bg-[#00A1FF] text-white font-semibold rounded-md shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all" [disabled]="loading">
        {{ isEditing ? 'Update Product' : 'Create Product' }}
      </button>
    </form>
  
    <!-- Success Modal -->
    <div id="successModal" *ngIf="showSuccessModal" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 w-full max-w-md">
      <div class="relative p-4 bg-white rounded-lg shadow-md dark:bg-gray-800 border border-green-300">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-full bg-green-100 p-2 flex items-center justify-center">
              <svg class="w-5 h-5 text-green-500" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
              </svg>
            </div>
            <p class="text-sm font-semibold text-gray-900 dark:text-white">Product created successfully!</p>
          </div>
          <button (click)="closeModal()" class="text-gray-400 hover:text-gray-900 dark:hover:text-white">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
