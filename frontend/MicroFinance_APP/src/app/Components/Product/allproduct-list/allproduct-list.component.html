<div class="container mx-auto px-4 py-8">
    <h2 class="text-2xl font-bold mb-6 text-[#00A1FF]">My Products</h2>

    <!-- Error message -->
    <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
        {{ error }}
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Product Card -->
        <div *ngFor="let product of products" class="bg-white rounded-lg shadow-md hover:shadow-lg transition-shadow duration-300">
            <div class="p-6">
                <!-- Product Image -->
                <div class="relative aspect-w-16 aspect-h-9 mb-4">
                    <img 
                        [src]="product.photo" 
                        alt="Product Photo"
                        class="w-full h-48 object-cover rounded-lg"
                    >
                </div>

                <!-- Product Details -->
                <div class="space-y-2">
                    <h3 class="text-2xl font-bold text-gray-900">{{ product.productName }}</h3>
                    <p class="text-sm text-gray-500">Dealer: {{ dealerMap[product.dealerId!] }}</p>
                    <p class="text-lg text-[#00A1FF]">{{ product.value | currency:'MMK' }}</p>
                </div>

                <!-- Select Button -->
                <div class="mt-4">
                    <button 
                        (click)="selectProduct(product)"
                        class="w-full bg-[#00A1FF] hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-md transition-colors duration-200"
                    >
                        Select Product
                    </button>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div *ngIf="products.length === 0 && !error" class="col-span-full text-center py-8">
            <p class="text-gray-500">No products found.</p>
        </div>
    </div>
</div>
