<div class="container mx-auto px-4 py-8">
    <h2 class="text-2xl font-bold mb-6 text-[#00A1FF]">Edit Product</h2>
  
    <!-- Success Modal -->
    <div id="successModal"
         *ngIf="showSuccessModal"
         class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 w-full max-w-md">
      <div class="relative p-4 bg-white rounded-lg shadow-md border border-green-300">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-full bg-green-100 p-2 flex items-center justify-center">
              <svg class="w-5 h-5 text-green-500" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
              </svg>
            </div>
            <p class="text-sm font-semibold text-[#00A1FF]">Product updated successfully!</p>
          </div>
          <button (click)="closeModal()" class="text-gray-400 hover:text-gray-900">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  
    <!-- Loading state -->
    <div *ngIf="isLoading" class="text-center py-8">
      <p class="text-gray-500">Loading product details...</p>
    </div>
  
    <!-- Error message -->
    <div *ngIf="error && !isLoading" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
      {{ error }}
    </div>
  
    <form *ngIf="!isLoading" (ngSubmit)="onSubmit()" class="max-w-lg mx-auto">
      <!-- Product Name -->
      <div class="mb-4">
        <label for="productName" class="block text-gray-700 mb-2">Product Name</label>
        <input
          type="text"
          id="productName"
          name="productName"
          [(ngModel)]="product.productName"
          required
          class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
      </div>
  
      <!-- Product Value -->
      <div class="mb-4">
        <label for="value" class="block text-gray-700 mb-2">Value (MMK)</label>
        <input
          type="number"
          id="value"
          name="value"
          [(ngModel)]="product.value"
          required
          class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
      </div>
  
      <!-- Product Photo -->
      <div class="mb-4">
        <label for="photo" class="block text-gray-700 mb-2">Product Photo</label>
        <input
          type="file"
          id="photo"
          name="photo"
          (change)="onFileChange($event)"
          class="w-full px-3 py-2 border rounded-md"
        >
        <div *ngIf="product.photo" class="mt-2">
          <img [src]="product.photo" alt="Current Product Photo" class="h-32 object-cover">
        </div>
      </div>
  
      <!-- Status -->
      <div class="mb-4">
        <label class="flex items-center">
          <input
            type="checkbox"
            [(ngModel)]="product.status"
            name="status"
            class="rounded text-blue-500 focus:ring-blue-500"
          >
          <span class="ml-2 text-gray-700">Active</span>
        </label>
      </div>
  
      <!-- Buttons -->
      <div class="flex justify-end space-x-4">
        <button
          type="button"
          (click)="goBack()"
          class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400 transition-colors"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition-colors"
          [disabled]="isLoading"
        >
          {{ isLoading ? 'Saving...' : 'Save Changes' }}
        </button>
      </div>
    </form>
  </div>
