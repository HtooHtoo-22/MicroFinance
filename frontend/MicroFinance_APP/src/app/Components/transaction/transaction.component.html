<div class="max-w-md mx-auto mt-17 bg-white p-6 rounded-lg shadow-lg">
  <h2 class="text-xl font-semibold text-center text-[#00A1FF] mb-4">New Transaction</h2>

  <!-- Success Modal -->
  <div id="successModal" 
       *ngIf="showSuccessModal"
       class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 w-full max-w-md">
    <div class="relative p-4 bg-white rounded-lg shadow-md border border-green-300">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 rounded-full bg-green-100 p-2 flex items-center justify-center">
            <svg class="w-5 h-5 text-green-500" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
            </svg>
          </div>
          <p class="text-sm font-semibold  text-[#00A1FF]">Transaction created successfully!</p>
        </div>
        <button (click)="closeModal()" class="text-gray-400 hover:text-gray-900">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Error Modal -->
  <div id="errorModal" 
       *ngIf="showErrorModal"
       class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 w-full max-w-md">
    <div class="relative p-4 bg-white rounded-lg shadow-md border border-red-300">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 rounded-full bg-red-100 p-2 flex items-center justify-center">
            <svg class="w-5 h-5 text-red-500" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
            </svg>
          </div>
          <p class="text-sm font-semibold text-gray-900">{{ errorMessage }}</p>
        </div>
        <button (click)="closeModal()" class="text-gray-400 hover:text-gray-900">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

 <!-- Confirmation Modal -->
<div *ngIf="showConfirmModal" class="fixed inset-0 bg-white/70 backdrop-blur-[1.5px] flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-xl shadow-xl p-6 max-w-lg w-full mx-4">
      <!-- Header -->
      <div class="flex justify-between items-start mb-4">
          <div>
              <h3 class="text-xl font-semibold text-gray-900">Confirm Transaction</h3>
              <p class="text-xs text-gray-500 mt-1">Account ID: {{ transactionForm.get('currentAccountId')?.value }}</p>
          </div>
          <button 
            (click)="closeModal()"
            class="text-gray-400 hover:text-gray-600 transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
              </svg>
          </button>
      </div>

      <!-- Transaction Details -->
      <div class="space-y-4 text-sm">
          <div class="flex justify-between items-center py-2 border-b">
              <span class="text-gray-500">Transaction Type:</span>
              <span class="font-medium">{{ transactionForm.get('type')?.value }}</span>
          </div>
          <div class="flex justify-between items-center py-2 border-b">
              <span class="text-gray-500">Amount:</span>
              <span class="font-medium">${{ transactionForm.get('amount')?.value }}</span>
          </div>
      </div>

      <!-- Actions -->
      <div class="mt-6 flex justify-end gap-2">
          <button 
            (click)="closeModal()"
            class="px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded-lg">
              Cancel
          </button>
          <button 
            (click)="confirmTransaction()"
            class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">
              Confirm Transaction
          </button>
      </div>
  </div>
</div>
  <form [formGroup]="transactionForm" (ngSubmit)="onSubmit()" class="space-y-4 " >

    <!-- Current Account ID -->
    <div>
      <label class="block text-sm font-medium text-gray-900">Current Account ID</label>
      <input type="text" 
             formControlName="currentAccountId" 
             class="w-full p-1 bg-gray-100 mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder:text-sm" 
             readonly>
    </div>

    <!-- Transaction Type Dropdown -->
    <div>
      <label class="block text-sm font-medium text-gray-900">Transaction Type</label>
      <select formControlName="type" class="w-48 p-1 bg-white border border-gray-300 mt-1 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 text-sm">
        <option *ngFor="let type of transactionTypes" [value]="type">{{ type }}</option>
      </select>
    </div>

    <!-- Amount Input -->
    <div>
      <label class="block text-sm font-medium text-gray-900">Amount</label>
      <input type="number" formControlName="amount" class="w-full p-1 bg-white mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder:text-sm">

    </div>

    <!-- Submit Button -->
    <button type="submit" 
      class="w-full mt-2 py-2 px-4 bg-[#00A1FF] text-white font-semibold rounded-md shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all">
      Submit Transaction
    </button>
  </form>
</div>
