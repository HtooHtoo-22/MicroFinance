<div class="min-h-screen bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-3xl mx-auto p-8 bg-white shadow-xl rounded-xl">
    
    <!-- Success Alert -->
    <div id="successModal" *ngIf="showSuccessModal" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 w-full max-w-md">
      <div class="relative p-4 bg-white rounded-lg shadow-md border border-green-300">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-full bg-green-100 p-2 flex items-center justify-center">
              <svg class="w-5 h-5 text-green-500" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
              </svg>
            </div>
            <p class="text-sm font-semibold text-gray-900">User created successfully!</p>
          </div>
          <button (click)="closeModal()" class="text-gray-400 hover:text-gray-900">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
    
    <!-- Error Alert -->
    <div *ngIf="showAlert && alertType === 'error'" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
      <span class="block sm:inline">{{ alertMessage }}</span>
    </div>
    
    <h2 class="text-3xl font-bold mb-8 text-center text-[#00A1FF]">Create New User</h2>
    
    <form [formGroup]="userForm" (ngSubmit)="createUser()">
      <!-- Name Field -->
      <div class="mb-4">
        <label for="name" class="block text-gray-700 text-sm font-bold mb-2">Name</label>
        <input type="text" id="name" formControlName="name" class="w-full px-4 py-2 border border-gray-300 rounded-md">
        <div *ngIf="submitted && nameControl?.invalid" class="text-red-500 text-sm mt-1">
          <div *ngIf="nameControl?.errors?.['required']">Name is required</div>
          <div *ngIf="nameControl?.errors?.['minlength']">Name must be at least 3 characters</div>
        </div>
      </div>

      <!-- Branch Selection -->
      <div class="mb-4">
        <label for="branchId" class="block text-gray-700 text-sm font-bold mb-2">Branch</label>
        <select id="branchId" formControlName="branchId" class="w-full px-4 py-2 border border-gray-300 rounded-md">
          <option *ngFor="let branch of branches" [value]="branch.id">{{ branch.name }}</option>
        </select>
        <div *ngIf="submitted && branchIdControl?.invalid" class="text-red-500 text-sm mt-1">Please select a branch</div>
      </div>

      <!-- Role Selection -->
      <div class="mb-4">
        <label for="roleId" class="block text-gray-700 text-sm font-bold mb-2">Role</label>
        <select id="roleId" formControlName="roleId" class="w-full px-4 py-2 border border-gray-300 rounded-md">
          <option *ngFor="let role of roles" [value]="role.id">{{ role.roleName }}</option>
        </select>
        <div *ngIf="submitted && roleIdControl?.invalid" class="text-red-500 text-sm mt-1">Please select a role</div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="w-full mt-1 py-2 px-4 bg-[#00A1FF] text-white font-semibold rounded-md hover:bg-blue-500">Create User</button>
    </form>
  </div>
</div>
