<div class="p-6">
  <h1 class="text-2xl font-bold mb-6 text-[#00A1FF]">Collateral Types</h1>

  <div class="overflow-x-auto">
    <table class="min-w-full bg-white border border-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Collateral Type</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
        <tr *ngFor="let type of collateralTypes">
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{type.name}}</td>
          <td class="px-6 py-4 whitespace-nowrap space-x-2">
            <button class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded text-sm"
                    (click)="editCollateralType(type.id!)">
              Edit
            </button>
            <button class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm"
                    (click)="deleteCollateralType(type.id!)">
              Delete
            </button>
          </td>
        </tr>
        <tr *ngIf="collateralTypes.length === 0">
          <td colspan="2" class="px-6 py-4 text-center text-gray-500">
            No collateral types found
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
