<div class="container mt-4 p-4">
  <!-- Success Alert -->
  <div id="successModal" 
       *ngIf="showSuccessModal"
       class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 w-full max-w-md">
    <div class="relative p-4 bg-white rounded-lg shadow-md dark:bg-gray-800 border border-green-300">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <div class="w-8 h-8 rounded-full bg-green-100 p-2 flex items-center justify-center">
            <svg class="w-5 h-5 text-green-500" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
            </svg>
          </div>
          <p class="text-sm font-semibold text-gray-900 dark:text-white">Successfully created collateral type!</p>
        </div>
        <button (click)="closeModal()" class="text-gray-400 hover:text-gray-900 dark:hover:text-white">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

    <!-- Error Alert -->
    <div *ngIf="showAlert && alertType === 'error'" 
    class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
 <span class="block sm:inline">{{ alertMessage }}</span>
</div>

  <h2 class="text-2xl font-semibold mb-4">Create Collateral Type</h2>
  
  <form [formGroup]="collateralTypeForm" (ngSubmit)="onSubmit()" class="max-w-md">
    <div class="mb-4">
      <label for="name" class="block text-sm font-medium text-gray-700">Name:</label>
      <input 
        type="text" 
        id="name" 
        formControlName="name"
        class="w-full p-1 bg-white mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400">
      <div *ngIf="collateralTypeForm.get('name')?.invalid && collateralTypeForm.get('name')?.touched"
           class="text-red-500 text-sm mt-1">
        Name is required.
      </div>
    </div>
    
    <div class="flex gap-4">
      <button 
        type="submit" 
        [disabled]="collateralTypeForm.invalid"
        class="btn btn-primary bg-[#00A1FF] text-white px-4 py-2 rounded-md hover:bg-blue-600 transition">
        Create
      </button>
      <a 
        routerLink="/dashboard/collateral-type-list"
        class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 text-gray-700">
        Back to List
      </a>
    </div>
  </form>


</div>
