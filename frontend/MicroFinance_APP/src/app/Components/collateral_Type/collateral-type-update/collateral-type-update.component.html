<div class="p-6">
  <h1 class="text-2xl font-bold mb-4">Update Collateral Type</h1>

  <form [formGroup]="updateForm" (ngSubmit)="onSubmit()" class="max-w-md">
    <div class="mb-4">
      <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
      <input type="text" 
             id="name" 
             formControlName="name" 
             class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
      <div *ngIf="updateForm.get('name')?.invalid && updateForm.get('name')?.touched" 
           class="text-red-500 text-sm mt-1">
        Name is required
      </div>
    </div>

    <div class="flex space-x-2">
      <button type="submit" 
              [disabled]="updateForm.invalid"
              class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded disabled:bg-gray-400">
        Update
      </button>
      <button type="button" 
              (click)="onCancel()"
              class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded">
        Cancel
      </button>
    </div>
  </form>
</div>
