<div class="flex">
  <!-- Sidebar -->
  <div class="sidebar w-64 bg-white h-screen fixed top-0 left-0 p-6 shadow-lg overflow-y-auto">
    <img [src]="imagePath" class="w-34 h-16 object-contain mb-6">
    <ul class="space-y-4 text-gray-900 text-sm font-semibold">
      <li class="flex items-center space-x-3 hover:bg-gray-100 p-2 rounded-lg transition duration-200" routerLinkActive="active-link">
        <img src="https://cdn0.iconfinder.com/data/icons/set-app-incredibles/24/Home-01-512.png" class="w-5 h-5">
        <a [routerLink]="['/manager-dashboard/home']" routerLinkActive="text-[#00A1FF]">Home</a>
      </li>

      <!-- Customer Management -->
      <li *ngIf="isEntry() || isOperation()" class="flex items-center space-x-3 hover:bg-gray-100 p-2 rounded-lg transition duration-200" routerLinkActive="active-link">
        <img src="https://cdn2.iconfinder.com/data/icons/e-commerce-line-4-1/1024/user4-512.png" class="w-5 h-5">
        <a [routerLink]="['/manager-dashboard/current-acc-list']" routerLinkActive="text-[#00A1FF]">Customer Management</a>
      </li>

      <!-- Cif Create -->
      <li *ngIf="isEntry() || isManager()" class="flex items-center space-x-3 hover:bg-gray-100 p-2 rounded-lg transition duration-200" routerLinkActive="active-link">
        <img src="https://cdn4.iconfinder.com/data/icons/top-search-6/128/_work-_working_computer_user_freelancer_internet_user_office_work_online_employee-1024.png" class="w-5 h-5">
        <a [routerLink]="['/manager-dashboard/dealer-detail']" routerLinkActive="text-[#00A1FF]">Dealer Account</a>
      </li>

      <li *ngIf="isEntry() || isManager()" class="flex items-center space-x-3 hover:bg-gray-100 p-2 rounded-lg transition duration-200 relative" routerLinkActive="active-link">
        <img src="https://cdn0.iconfinder.com/data/icons/phosphor-bold-vol-3-1/256/list-bullets-duotone-512.png" class="w-5 h-5">
        <a [routerLink]="['/manager-dashboard/sme-loan-list']" routerLinkActive="text-[#00A1FF]">
          SME Loan List
          <span *ngIf="smeLoanCount > 0" 
            class="absolute top-0 right-0 bg-red-500 text-white rounded-full text-xs w-4 h-4 flex items-center justify-center">
            {{ smeLoanCount }}
          </span>
        </a>
      </li>

      <li *ngIf="isEntry() || isManager()" class="flex items-center space-x-3 hover:bg-gray-100 p-2 rounded-lg transition duration-200 relative" routerLinkActive="active-link">
        <img src="https://cdn0.iconfinder.com/data/icons/phosphor-bold-vol-3-1/256/list-bullets-duotone-512.png" class="w-5 h-5">
        <a [routerLink]="['/manager-dashboard/hp-loan-list']" routerLinkActive="text-[#00A1FF]">HP Loan List</a>
        <span *ngIf="hpLoanCount > 0" 
          class="absolute top-0 right-0 bg-red-500 text-white rounded-full text-xs w-4 h-4 flex items-center justify-center">
          {{ hpLoanCount }}
        </span>
      </li>

      <!-- Dealer Management -->
      <li *ngIf="isEntry() || isManager()" class="flex items-center space-x-3 hover:bg-gray-100 p-2 rounded-lg transition duration-200 relative" routerLinkActive="active-link">
        <img src="https://cdn0.iconfinder.com/data/icons/phosphor-bold-vol-3-1/256/list-bullets-duotone-512.png" class="w-5 h-5">
        <a [routerLink]="['/manager-dashboard/dealer-list']" routerLinkActive="text-[#00A1FF]">Dealer List</a>
        <span *ngIf="newDealerCount > 0" 
          class="absolute top-0 right-0 bg-red-500 text-white rounded-full text-xs w-4 h-4 flex items-center justify-center">
          {{ newDealerCount }}
        </span>
      </li>
    </ul>
  </div>

    <!-- Main content wrapper -->
    <div class="flex-1 justify-between ml-64">
      <header class="fixed right-0 left-64 bg-white z-10 shadow-md p-4 flex justify-between items-center">
        <!-- Left side content -->
        <div class="flex items-center space-x-2">
          <span class="font-medium text-gray-700">Manager Dashboard</span>
        </div>
      
        <!-- Right side content -->
        <div class="flex items-center space-x-4">
          <div *ngIf="getCurrentRole()" class="text-right">
            <div class="text-sm font-medium text-gray-700">
              {{ getCurrentRoleName() }}
            </div>
            <div *ngIf="getCurrentEmail()" class="text-xs text-gray-500">
              {{ getCurrentEmail() }}
            </div>
          </div>
          <button (click)="openLogoutModal()" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition duration-200">
            <span>Logout</span>
          </button>
        </div>
      </header>
    
      <div class="pt-20 p-7 bg-gray-100 min-h-screen">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
  
<!-- Logout Modal -->
<div *ngIf="showLogoutModal" class="fixed inset-0 bg-white-/70 backdrop-blur-[1.5px] flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-lg shadow-lg p-6 w-96">
    <h2 class="text-2xl font-semibold text-blue-800 mb-4">Confirm Logout</h2>
    <p class="text-gray-700 mb-6">Are you sure you want to logout?</p>
    <div class="flex justify-end space-x-4">
      <button (click)="closeLogoutModal()" class="px-4 py-2 bg-gray-200 text-black rounded-lg hover:bg-gray-300 transition duration-200">
        Cancel
      </button>
      <button (click)="confirmLogout()" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition duration-200">
        Logout
      </button>
    </div>
  </div>
</div>
