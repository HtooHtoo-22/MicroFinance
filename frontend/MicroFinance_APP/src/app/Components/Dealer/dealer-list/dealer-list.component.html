<!-- dealer-list.component.html -->
<div class="container mx-auto p-6">
    <h2 class="text-[#00A1FF] text-2xl font-bold mb-6">Dealers Management</h2>
    
    <table class="min-w-full bg-white shadow-md rounded-lg overflow-hidden">
      <thead class="bg-gray-100">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Business Name</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Phone</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Register Date</th>

          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
        <tr *ngFor="let dealer of dealers" class="hover:bg-gray-50">
          <td class="px-6 py-4 whitespace-nowrap">{{ dealer.businessName }}</td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                  [ngClass]="{
                    'bg-yellow-100 text-yellow-800': dealer.status === 'PENDING',
                    'bg-green-100 text-green-800': dealer.status === 'ACTIVE',
                    'bg-red-100 text-red-800': dealer.status === 'REJECTED'
                  }">
              {{ dealer.status }}
            </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">{{ dealer.phone }}</td>
          <td class="px-6 py-4 whitespace-nowrap">{{ dealer.registerDate }}</td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="flex space-x-2" *ngIf="dealer.status === 'PENDING'">
              <button class="inline-flex items-center px-3 py-1 border border-transparent text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500"
                      (click)="approveDealer(dealer.id)">
                ✓ Approve
              </button>
              <button class="inline-flex items-center px-3 py-1 border border-transparent text-sm font-medium rounded-md text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500"
                      (click)="rejectDealer(dealer.id)">
                ✗ Reject
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
</div>
