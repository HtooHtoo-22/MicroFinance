<form [formGroup]="dealerForm" (ngSubmit)="onSubmit()" class="max-w-3xl mx-auto p-6 bg-white rounded-lg shadow-lg space-y-6">
    <!-- Business Details -->
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Business Name</label>
        <input 
          formControlName="businessName"
          type="text"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter business name">
        <p *ngIf="dealerForm.get('businessName')?.hasError('required') && dealerForm.get('businessName')?.touched" 
           class="mt-1 text-sm text-red-600">
          Business name is required
        </p>
      </div>
  
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
        <input 
          formControlName="address"
          type="text"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter address">
        <p *ngIf="dealerForm.get('address')?.hasError('required') && dealerForm.get('address')?.touched" 
           class="mt-1 text-sm text-red-600">
          Address is required
        </p>
      </div>
  
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
        <input 
          formControlName="phone"
          type="text"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter phone number">
        <p *ngIf="dealerForm.get('phone')?.hasError('required') && dealerForm.get('phone')?.touched" 
           class="mt-1 text-sm text-red-600">
          Phone is required
        </p>
        <p *ngIf="dealerForm.get('phone')?.hasError('pattern')" 
           class="mt-1 text-sm text-red-600">
          Invalid phone number (10-11 digits required)
        </p>
      </div>
  
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input 
          formControlName="email"
          type="email"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter email">
        <p *ngIf="dealerForm.get('email')?.hasError('required') && dealerForm.get('email')?.touched" 
           class="mt-1 text-sm text-red-600">
          Email is required
        </p>
        <p *ngIf="dealerForm.get('email')?.hasError('email')" 
           class="mt-1 text-sm text-red-600">
          Invalid email format
        </p>
      </div>
  
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Current Account ID</label>
        <input 
          formControlName="currentAccountId"
          type="text"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter current account ID (e.g., ACC-4-79804)">
        <p *ngIf="dealerForm.get('currentAccountId')?.hasError('required') && dealerForm.get('currentAccountId')?.touched" 
           class="mt-1 text-sm text-red-600">
          Account ID is required
        </p>
      </div>
  
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Company Value</label>
        <input 
          formControlName="companyValue"
          type="number"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Enter company value">
        <p *ngIf="dealerForm.get('companyValue')?.hasError('required') && dealerForm.get('companyValue')?.touched" 
           class="mt-1 text-sm text-red-600">
          Company value is required
        </p>
        <p *ngIf="dealerForm.get('companyValue')?.hasError('min')" 
           class="mt-1 text-sm text-red-600">
          Value must be 0 or higher
        </p>
      </div>
    </div>
  
    <!-- Submit Button -->
    <div class="flex justify-end">
      <button 
        type="submit"
        [disabled]="!dealerForm.valid"
        class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed">
        Create Dealer
      </button>
    </div>
  </form>

<!-- Success Alert -->
<div id="successModal" 
     *ngIf="showSuccessModal"
     class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 w-full max-w-md">
  <div class="relative p-4 bg-white rounded-lg shadow-md dark:bg-gray-800 border border-green-300">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-full bg-green-100 p-2 flex items-center justify-center">
          <svg class="w-5 h-5 text-green-500" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
          </svg>
        </div>
        <p class="text-sm font-semibold text-gray-900 dark:text-white">Successfully created dealer!</p>
      </div>
      <button (click)="closeModal()" class="text-gray-400 hover:text-gray-900 dark:hover:text-white">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
        </svg>
      </button>
    </div>
  </div>
</div>
