<form [formGroup]="currentAccountForm" (ngSubmit)="onSubmit()" class="max-w-xl w-full mx-auto mt-16 p-6 bg-white shadow-md rounded-lg">
    <h2 class="text-xl font-bold text-gray-700 mb-4">Current Account Created Form</h2>
  
    <div>
      <label class="lock text-sm/6 font-medium text-gray-900">CIF ID</label>
      <input type="text" formControlName="cifId"
      class="w-full p-1 bg-white mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder:text-sm" />
    </div>
  
    <div class="grid grid-cols-2 gap-4 mt-4">
      <div>
        <label class="lock text-sm/6 font-medium text-gray-900">Max Amount</label>
        <input type="number" formControlName="maxAmount"
        class="w-full p-1 bg-white mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder:text-sm" />
      </div>
      <div>
        <label class="lock text-sm/6 font-medium text-gray-900">Min Amount</label>
        <input type="number" formControlName="minAmount"
        class="w-full p-1 bg-white mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder:text-sm" />
      </div>
    </div>
  
    <button type="submit"
      class="w-full mt-6 p-3 bg-[#00A1FF] text-white font-bold rounded-md hover:bg-[#008BDC] transition">
      Submit
    </button>
    
  </form>
