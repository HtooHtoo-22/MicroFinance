<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<div class="min-h-screen flex">
  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r border-gray-200 fixed h-full top-0 left-0 z-20">
    <div class="p-4 border-b border-gray-200 flex items-center justify-center">
      <img [src]="imagePath" class="h-12 w-auto " alt="Logo" >
    </div>
    
    <nav class="p-4 space-y-1">
      <!-- Navigation Items -->
      <div class="space-y-4">
        <!-- Repeat this block for each menu item -->
        <div class="group">
          <a href="#" class="flex items-center px-3 py-2 text-sm font-medium rounded-lg 
                          text-gray-700 hover:bg-gray-100 hover:text-gray-900 transition-colors">
            <svg class="w-5 h-5 mr-3 text-gray-400 group-hover:text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            Dashboard
          </a>
        </div>
        <a [routerLink]="['/dealer-dashboard/dealer-transaction']" 
            class="flex items-center px-3 py-2 text-sm font-medium rounded-lg 
                  text-gray-700 hover:bg-gray-100 hover:text-gray-900 transition-colors">
          Transactions
        </a>
        <a [routerLink]="['/dealer-dashboard/create-product']" 
            class="flex items-center px-3 py-2 text-sm font-medium rounded-lg 
                  text-gray-700 hover:bg-gray-100 hover:text-gray-900 transition-colors">
          Products
        </a>
        <a [routerLink]="['/dealer-dashboard/product-list']"
        class="flex items-center px-3 py-2 text-sm font-medium rounded-lg 
               text-gray-700 hover:bg-gray-100 hover:text-gray-900 transition-colors">
       <svg class="w-5 h-5 mr-3 text-gray-400 group-hover:text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
         <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V7m-9-4v4m0 0H7m5 0h5"/>
       </svg>
       Products List
     </a>
     <a [routerLink]="['/dealer-dashboard/all-list']"
     class="flex items-center px-3 py-2 text-sm font-medium rounded-lg 
            text-gray-700 hover:bg-gray-100 hover:text-gray-900 transition-colors">
    <svg class="w-5 h-5 mr-3 text-gray-400 group-hover:text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V7m-9-4v4m0 0H7m5 0h5"/>
    </svg>
     List
  </a>
        <!-- Add other menu items here -->
      </div>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 ml-64">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 fixed w-full top-0 z-10">
      <div class="flex items-center justify-between px-6 py-4">
        
        <!-- User Menu -->
        <div class="flex items-center space-x-4">
          <button class="p-2 hover:bg-gray-100 rounded-full">
            <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
          </button>
          <div class="flex items-center space-x-2">
            <div class="h-8 w-8 rounded-full bg-blue-500 flex items-center justify-center text-white">JD</div>
            <span class="text-sm font-medium text-gray-700">John Doe</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="pt-16 min-h-screen">
      <div class="p-6">
        <router-outlet></router-outlet>
       
      </div>
    </main>
  </div>
</div>

</body>
</html>
