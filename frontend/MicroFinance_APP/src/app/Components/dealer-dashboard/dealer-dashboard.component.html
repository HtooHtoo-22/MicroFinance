<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<div class="min-h-screen flex">
  <!-- Sidebar -->
  <div class="sidebar w-64 bg-white h-screen fixed top-0 left-0 p-6 shadow-lg overflow-y-auto">
    <img [src]="imagePath" class="w-34 h-16 object-contain mb-6">
    <ul class="space-y-4 text-gray-900 text-sm font-semibold">
      <!-- <li class="flex items-center space-x-3 hover:bg-gray-100 p-2 rounded-lg transition duration-200" routerLinkActive="active-link">
        <img src="https://cdn0.iconfinder.com/data/icons/set-app-incredibles/24/Home-01-512.png" class="w-5 h-5">
        <a [routerLink]="['/dealer-dashboard/home']" routerLinkActive="text-[#00A1FF]">Dashboard</a>
      </li> -->

      <li class="flex items-center space-x-3 hover:bg-gray-100 p-2 rounded-lg transition duration-200" routerLinkActive="active-link">
        <img src="https://cdn2.iconfinder.com/data/icons/e-commerce-line-4-1/1024/user4-512.png" class="w-5 h-5">
        <a [routerLink]="['/dealer-dashboard/dealer-transaction']" routerLinkActive="text-[#00A1FF]">Transactions</a>
      </li>

      <li class="flex items-center space-x-3 hover:bg-gray-100 p-2 rounded-lg transition duration-200" routerLinkActive="active-link">
        <img src="https://cdn4.iconfinder.com/data/icons/top-search-6/128/_work-_working_computer_user_freelancer_internet_user_office_work_online_employee-1024.png" class="w-5 h-5">
        <a [routerLink]="['/dealer-dashboard/create-product']" routerLinkActive="text-[#00A1FF]">Products</a>
      </li>

      <li class="flex items-center space-x-3 hover:bg-gray-100 p-2 rounded-lg transition duration-200" routerLinkActive="active-link">
        <img src="https://cdn0.iconfinder.com/data/icons/phosphor-bold-vol-3-1/256/list-bullets-duotone-512.png" class="w-5 h-5">
        <a [routerLink]="['/dealer-dashboard/all-list']" routerLinkActive="text-[#00A1FF]">Product List</a>
      </li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="flex-1 ml-64">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 fixed w-full top-0 z-10">
      <div class="flex items-center justify-between px-6 py-4">
        
        <!-- User Menu -->
        <div class="flex items-center space-x-4">
          <button class="p-2 hover:bg-gray-100 rounded-full">
            <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
          </button>

          <div class="flex items-center space-x-2">
            <button (click)="openLogoutModal()" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition duration-200">
              <span>Logout</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="pt-16 min-h-screen">
      <div class="p-6">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>

<!-- Logout Modal -->
<div *ngIf="showLogoutModal" class="fixed inset-0 bg-white-/70 backdrop-blur-[1.5px] flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-lg shadow-lg p-6 w-96">
    <h2 class="text-2xl font-semibold text-blue-800 mb-4">Confirm Logout</h2>
    <p class="text-gray-700 mb-6">Are you sure you want to logout?</p>
    <div class="flex justify-end space-x-4">
      <button (click)="closeLogoutModal()" class="px-4 py-2 bg-gray-200 text-black rounded-lg hover:bg-gray-300 transition duration-200">
        Cancel
      </button>
      <button (click)="confirmLogout()" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition duration-200">
        Logout
      </button>
    </div>
  </div>
</div>
