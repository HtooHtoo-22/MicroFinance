<div class="container mx-auto p-4">
  <h2 class="text-2xl font-bold mb-6">Update Branch</h2>

  <!-- Loading State -->
  <div *ngIf="loading" class="flex justify-center items-center py-4">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
    {{ errorMessage }}
  </div>

  <form *ngIf="!loading" [formGroup]="branchForm" (ngSubmit)="onSubmit()" class="max-w-lg">
    <div class="mb-4">
      <label class="block text-gray-700 text-sm font-bold mb-2">Code</label>
      <input type="text" formControlName="code" 
             class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
    </div>

    <div class="mb-4">
      <label class="block text-gray-700 text-sm font-bold mb-2">Name</label>
      <input type="text" formControlName="name" 
             class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
    </div>

    <div class="mb-4">
      <label class="block text-gray-700 text-sm font-bold mb-2">Address</label>
      <input type="text" formControlName="address" 
             class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
    </div>

    <div class="mb-4">
      <label class="block text-gray-700 text-sm font-bold mb-2">State</label>
      <input type="text" formControlName="state" 
             class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
    </div>

    <div class="mb-4">
      <label class="block text-gray-700 text-sm font-bold mb-2">Township</label>
      <input type="text" formControlName="township" 
             class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
    </div>

    <div class="flex items-center justify-between">
      <button type="submit" 
              [disabled]="!branchForm.valid || loading"
              class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
        {{ loading ? 'Updating...' : 'Update Branch' }}
      </button>
      <button type="button" 
              [disabled]="loading"
              routerLink="/admin-dashboard/branch-list"
              class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
        Cancel
      </button>
    </div>
  </form>
</div>
