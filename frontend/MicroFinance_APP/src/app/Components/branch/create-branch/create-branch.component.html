<div class="min-h-screen bg-gray-100 p-6">
  <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-8">
    <!-- Header -->
    <div class="mb-6">
      <h2 class="text-3xl font-bold mb-8 text-center text-[#00A1FF]">Create New Branch</h2>
    </div>

    <!-- Success Modal -->
    <div id="successModal" 
         *ngIf="showSuccessModal"
         class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 w-full max-w-md">
      <div class="relative p-4 bg-white rounded-lg shadow-md dark:bg-gray-800 border border-green-300">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-full bg-green-100 p-2 flex items-center justify-center">
              <svg class="w-5 h-5 text-green-500" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
              </svg>
            </div>
            <p class="text-sm font-semibold text-gray-900 dark:text-white">Successfully created branch!</p>
          </div>
          <button (click)="closeModal()" class="text-gray-400 hover:text-gray-900 dark:hover:text-white">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Error Alert -->
    <div *ngIf="showAlert && alertType === 'error'" 
         class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
      <span class="block sm:inline">{{ alertMessage }}</span>
    </div>

    <!-- Form -->
    <form [formGroup]="branchForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Branch Code -->
      <div class="space-y-2 mb-4">
        <label for="code" class="block text-sm/6 font-medium text-gray-900">Branch Code</label>
        <input
          type="text"
          id="code"
          formControlName="code"
          class="w-full px-4 p-1 bg-white border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder:text-sm"
          placeholder="Enter branch code">
        <div *ngIf="branchForm.get('code')?.touched && branchForm.get('code')?.invalid" class="text-red-500 text-sm">
          Branch code is required
        </div>
      </div>

      <!-- Branch Name -->
      <div class="space-y-2 mb-4">
        <label for="name" class="block text-sm/6 font-medium text-gray-900">Branch Name</label>
        <input
          type="text"
          id="name"
          formControlName="name"
          class="w-full px-4 p-1 bg-white border  border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder:text-sm"
          placeholder="Enter branch name">
        <div *ngIf="branchForm.get('name')?.touched && branchForm.get('name')?.invalid" class="text-red-500 text-sm">
          Branch name is required
        </div>
      </div>

      <!-- Address -->
      <div class="space-y-2 mb-4">
        <label for="address" class="block text-sm/6 font-medium text-gray-900">Address</label>
        <textarea
          id="address"
          formControlName="address"
          rows="3"
          class="w-full px-4 p-1 bg-white border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder:text-sm"
          placeholder="Enter branch address"></textarea>
        <div *ngIf="branchForm.get('address')?.touched && branchForm.get('address')?.invalid" class="text-red-500 text-sm">
          Address is required
        </div>
      </div>

      <!-- State -->
      <div class="space-y-2 mb-4">
        <label for="state" class="block text-sm/6 font-medium text-gray-900">State</label>
        <input
          type="text"
          id="state"
          formControlName="state"
          class="w-full px-4 p-1 bg-white border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder:text-sm"
          placeholder="Enter state">
        <div *ngIf="branchForm.get('state')?.touched && branchForm.get('state')?.invalid" class="text-red-500 text-sm">
          State is required
        </div>
      </div>

      <!-- Township -->
      <div class="space-y-2 mb-4">
        <label for="township" class="block text-sm/6 font-medium text-gray-900">Township</label>
        <input
          type="text"
          id="township"
          formControlName="township"
          class="w-full px-4 p-1 bg-white border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder:text-sm"
          placeholder="Enter township">
        <div *ngIf="branchForm.get('township')?.touched && branchForm.get('township')?.invalid" class="text-red-500 text-sm">
          Township is required
        </div>
      </div>

      <!-- Submit Button -->
      <div class="flex justify-end space-x-4">
        <button
          type="button"
          routerLink="/branch-list"
          class="px-4 py-2 text-gray-700 bg-gray-200 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500">
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="!branchForm.valid"
          class="px-4 py-2 text-white bg-blue-500 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-blue-300 disabled:cursor-not-allowed">
          Create Branch
        </button>
      </div>
    </form>
  </div>
</div>
