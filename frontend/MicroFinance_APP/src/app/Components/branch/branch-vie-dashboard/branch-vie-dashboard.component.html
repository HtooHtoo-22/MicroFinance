<div class="container mx-auto px-4 py-6">
  <!-- Branch View Section -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
    <!-- Section Header -->
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-semibold text-gray-800">Branch Overview</h2>
      <a *ngIf="branches.length" 
         class="text-blue-600 hover:text-blue-800 text-sm font-medium flex items-center"
         routerLink="/admin-dashboard/branch-list">
        View All Branches
        <svg xmlns="http://www.w3.org/2000/svg" class="ml-1 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </a>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="flex flex-col items-center justify-center py-8 space-y-4">
      <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent"></div>
      <p class="text-gray-600">Loading branches...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50 rounded-lg border border-red-200 flex items-start">
      <svg class="w-5 h-5 mt-0.5 mr-3 text-red-500" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
      </svg>
      <div>
        <h3 class="font-medium text-red-800">Error Loading Data</h3>
        <p class="text-sm text-red-600 mt-1">{{ errorMessage }}</p>
        <button (click)="loadBranches()" class="mt-2 text-sm text-red-700 hover:text-red-900 font-medium flex items-center">
          <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          Retry
        </button>
      </div>
    </div>

    <!-- Branch Cards Grid -->
    <div *ngIf="!loading && !errorMessage" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div *ngFor="let branch of branches" class="group">
        <div class="p-5 border border-gray-200 rounded-lg hover:border-blue-300 transition-colors">
          <div class="flex justify-between items-start">
            <div>
              <h3 class="text-lg font-semibold text-gray-800 group-hover:text-blue-600 transition-colors">
                {{ branch.name }}
              </h3>
              <div class="mt-1 flex items-center text-sm text-gray-500 space-x-4">
                <span class="flex items-center">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                  </svg>
                  <span *ngIf="branch.activeUserCount !== undefined; else loadingCount">
                    {{ branch.activeUserCount }} Users
                  </span>
                  <ng-template #loadingCount>
                    <span class="inline-block h-4 w-16 bg-gray-200 rounded animate-pulse"></span>
                  </ng-template>
                </span>
                <span class="flex items-center">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/>
                  </svg>
                  <span *ngIf="branch.activeAccountCount !== undefined; else loadingAccountCount">
                    {{ branch.activeAccountCount }} Accounts
                  </span>
                  <ng-template #loadingAccountCount>
                    <span class="inline-block h-4 w-16 bg-gray-200 rounded animate-pulse"></span>
                  </ng-template>
                </span>
              </div>
            </div>
            <div class="p-2 bg-blue-50 rounded-md">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
              </svg>
            </div>
          </div>
          
          <div class="mt-4 flex justify-between items-center">
            <div class="flex items-center text-sm text-gray-500">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
              <span>{{branch.address}}</span>
            </div>
            <button 
              class="px-3 py-1.5 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-md text-sm font-medium transition-colors"
              [routerLink]="['/admin-dashboard/view-branch', branch.id]">
              View Details
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading && branches.length === 0" class="text-center py-8">
      <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-gray-100 mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <h3 class="text-gray-700 font-medium">No branches found</h3>
      <p class="text-sm text-gray-500 mt-1">There are currently no branches available</p>
    </div>
  </div>
</div>
