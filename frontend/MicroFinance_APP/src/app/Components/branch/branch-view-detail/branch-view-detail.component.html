<!-- branch-view-detail.component.html -->
<div class="container mx-auto px-4 py-8">
  <div class="bg-white rounded-lg shadow-md p-6">
    <!-- Back Button -->
    <button (click)="goBack()" class="mb-4 flex items-center text-blue-500 hover:text-blue-700">
      <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
      </svg>
      Back to Branches
    </button>

    <!-- Loading State -->
    <div *ngIf="loading" class="flex flex-col items-center justify-center py-8">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
      <p class="mt-4 text-gray-600">Loading branch details...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
      <span class="block sm:inline">{{ errorMessage }}</span>
      <button class="absolute top-0 bottom-0 right-0 px-4" (click)="errorMessage = null">
        <span class="sr-only">Close</span>
        <svg class="h-6 w-6" stroke="currentColor" fill="none" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Branch Details -->
    <div *ngIf="branch && !loading" class="space-y-6">
      <h2 class="text-2xl font-bold text-[#00A1FF]">Branch Details</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Left Column -->
        <div class="space-y-4">
          <div>
            <h3 class="text-sm font-medium text-gray-500">Branch Code</h3>
            <p class="mt-1 text-sm text-gray-900">{{ branch.code }}</p>
          </div>
          
          <div>
            <h3 class="text-sm font-medium text-gray-500">Branch Name</h3>
            <p class="mt-1 text-sm text-gray-900">{{ branch.name }}</p>
          </div>
        </div>
        
      
      <!-- Activity Counts -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-8">
        <!-- Active Users Card -->
        <div class="bg-blue-50 rounded-lg p-4 border border-blue-100">
          <div class="flex justify-between items-center">
            <div>
              <h3 class="text-sm font-medium text-blue-800">Active Users</h3>
              <p *ngIf="!loadingCounts" class="text-2xl font-bold text-blue-900 mt-1">
                {{ activeUsersCount }}
              </p>
              <div *ngIf="loadingCounts" class="h-8 w-16 bg-blue-100 rounded animate-pulse mt-1"></div>
            </div>
            <div class="p-2 bg-blue-100 rounded-full">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </div>
          </div>
        </div>
        
        <!-- Active Accounts Card -->
        <div class="bg-green-50 rounded-lg p-4 border border-green-100">
          <div class="flex justify-between items-center">
            <div>
              <h3 class="text-sm font-medium text-green-800">Active Accounts</h3>
              <p *ngIf="!loadingCounts" class="text-2xl font-bold text-green-900 mt-1">
                {{ activeAccountsCount }}
              </p>
              <div *ngIf="loadingCounts" class="h-8 w-16 bg-green-100 rounded animate-pulse mt-1"></div>
            </div>
            <div class="p-2 bg-green-100 rounded-full">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
      
    <!-- In branch-view-detail.component.html -->
<div class="bg-white shadow-xl rounded-2xl min-h-[100px] w-full p-4 mt-6">
  <app-monthly-hploancount *ngIf="branch" [branchId]="branch.id"></app-monthly-hploancount>
</div>

<div class="bg-white shadow-xl rounded-2xl min-h-[100px] w-full p-4 mt-6">
  <app-monthly-smeloancount *ngIf="branch" [branchId]="branch.id"></app-monthly-smeloancount>
</div>
      
      <!-- Action Buttons -->
      <div class="flex space-x-4 pt-6">
        <button [routerLink]="['/admin-dashboard/update-branch', branch.id]" 
                class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md">
          Edit Branch
        </button>
        <button (click)="goBack()" 
                class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-md">
          Back to List
        </button>
      </div>
    </div>
  </div>
</div>
