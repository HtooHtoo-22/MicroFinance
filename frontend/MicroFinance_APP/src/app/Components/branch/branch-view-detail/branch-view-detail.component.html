<div class="container mx-auto px-4 py-8">
    <div class="bg-white rounded-lg shadow-md p-6">
      <!-- Back Button -->
      <button (click)="goBack()" class="mb-4 flex items-center text-blue-500 hover:text-blue-700">
        <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        Back to Branches
      </button>
  
      <!-- Loading State -->
      <div *ngIf="loading" class="flex flex-col items-center justify-center py-8">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
        <p class="mt-4 text-gray-600">Loading branch details...</p>
      </div>
  
      <!-- Error State -->
      <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
        <span class="block sm:inline">{{ errorMessage }}</span>
        <button class="absolute top-0 bottom-0 right-0 px-4" (click)="errorMessage = null">
          <span class="sr-only">Close</span>
          <svg class="h-6 w-6" stroke="currentColor" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
  
      <!-- Branch Details -->
      <div *ngIf="branch && !loading" class="space-y-6">
        <h2 class="text-2xl font-bold text-[#00A1FF]">Branch Details</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Left Column -->
          <div class="space-y-4">
            <div>
              <h3 class="text-sm font-medium text-gray-500">Branch Code</h3>
              <p class="mt-1 text-sm text-gray-900">{{ branch.code }}</p>
            </div>
            
            <div>
              <h3 class="text-sm font-medium text-gray-500">Branch Name</h3>
              <p class="mt-1 text-sm text-gray-900">{{ branch.name }}</p>
            </div>
            

          </div>
          
          <!-- Right Column -->
          <div class="space-y-4">
            
          </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="flex space-x-4 pt-6">
          <button [routerLink]="['/admin-dashboard/update-branch', branch.id]" 
                  class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md">
            Edit Branch
          </button>
          <button (click)="goBack()" 
                  class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-md">
            Back to List
          </button>
        </div>
      </div>
    </div>
  </div>
