<div class="max-w-4xl mx-auto p-6">
    

    <div *ngIf="isLoggedIn" class="flex-1 flex flex-col">
        
        <div class="mb-4">
            <select 
                [value]="selectedYear" 
                (change)="onYearChange($event)" 
                class="w-full max-w-xs border border-gray-300 rounded-lg p-2 text-lg focus:ring-2 focus:ring-blue-500"
            >
                <option *ngFor="let year of years" [value]="year">{{ year }}</option>
            </select>
        </div>
        <div class="flex-1 min-w-[150px] min-h-[400px]"> <!-- Increased height -->
            <canvas id="loanChart"></canvas>
        </div>
    </div>

    <p *ngIf="!isLoggedIn" class="text-center text-gray-600 text-lg mt-4">
        Please <a href="/login" class="text-blue-500 hover:underline">log in</a> to view the monthly SME loan statistics.
    </p>
</div>
