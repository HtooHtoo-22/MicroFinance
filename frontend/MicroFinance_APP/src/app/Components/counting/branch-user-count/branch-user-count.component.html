<div class="container">
    <div class="card">
      <label for="branch">Select a Branch:</label>
      <select id="branch" [(ngModel)]="selectedBranchId" (change)="loadActiveUserCount()">
        <option *ngFor="let branch of branches" [value]="branch.id">
          {{ branch.name }}
        </option>
      </select>
    </div>
  
    <div *ngIf="activeUserCount !== null" class="card result-card">
      <p>Active Users in Selected Branch:</p>
      <h2>{{ activeUserCount }}</h2>
    </div>
  
    <div *ngIf="activeUserCount === null && selectedBranchId" class="card loading-card">
      <p>Loading active user count...</p>
    </div>
  </div>
