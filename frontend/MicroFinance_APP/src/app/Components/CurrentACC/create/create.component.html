<form [formGroup]="currentAccountForm" (ngSubmit)="onSubmit()" class="max-w-xl w-full mt-16 mx-auto p-6 bg-white shadow-md rounded-lg">
  <h2 class="text-xl font-bold text-gray-700 mb-4">Current Account Created Form</h2>

  <!-- <div>
    <label class="block text-sm/6 font-medium text-gray-900">CIF ID</label>
    <input type="text" formControlName="cifId" readonly
    class="w-full p-1 bg-gray-100 mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" />
  </div> -->

  <label class="block text-sm/6 font-medium text-gray-900">CIF ID</label>
  <input type="text" formControlName="cifCode" [value]="currentAccountForm.get('cifCode')?.value" readonly
class="w-full p-1 bg-gray-100 mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" />

  <div class="grid grid-cols-2 gap-4 mt-4">
    <div>
      <label class="block text-sm/6 font-medium text-gray-900">Max Amount</label>
      <input type="number" formControlName="maxAmount"
      class="w-full p-1 bg-white mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" />
    </div>
    <div>
      <label class="block text-sm/6 font-medium text-gray-900">Min Amount</label>
      <input type="number" formControlName="minAmount"
      class="w-full p-1 bg-white mt-1 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" />
    </div>
  </div>

  <button type="submit"
    [disabled]="!currentAccountForm.valid"
    class="w-full mt-6 p-3 bg-[#00A1FF] text-white font-bold rounded-md hover:bg-[#008BDC] transition">
    Submit
  </button>
</form>
