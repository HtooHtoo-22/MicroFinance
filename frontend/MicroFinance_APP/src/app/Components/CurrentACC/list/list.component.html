<div class="container mx-auto px-4 py-8">
  <h2 class="text-2xl font-bold mb-6 text-[#00A1FF]">Current Accounts List</h2>

  <div class="overflow-x-auto bg-white rounded-lg shadow">
    <table class="min-w-full table-auto">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Account ID</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">User  Name</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Total Balance</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let account of paginatedAccounts" class="hover:bg-gray-50">
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ account.accountId }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ account.userName }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ account.totalBalance }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
            <span [class]="account.freezeStatus ? 'text-red-600' : 'text-green-600'">
              {{ account.freezeStatus ? 'Frozen' : 'Active' }}
            </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-2 flex">
            <button
              (click)="onUpdateAccount(account)" 
              class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded-md text-sm">
              Update
            </button>
            <button
              (click)="freezeAccount(account)"
              [class]="account.freezeStatus ? 'bg-red-500 hover:bg-red-600' : 'bg-green-500 hover:bg-green-600'"
              class="text-white px-4 py-2 rounded-md text-sm transition duration-150 ease-in-out">
              {{ account.freezeStatus ? 'Freeze' : 'Unfreeze' }}
            </button>
            <button  
              [routerLink]="['/entry-dashboard/cif-details', account.cifId]"
              class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded-md text-sm transition duration-150 ease-in-out">
              View Details
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Add Pagination Controls -->
    <div class="px-6 py-4 bg-gray-50 border-t border-gray-200">
      <div class="flex items-center justify-between">
        <!-- Items per page info -->
        <div class="text-sm text-gray-700">
          Showing <span class="font-medium">{{ startIndex }}</span> to <span class="font-medium">{{ endIndex }}</span> of
          <span class="font-medium">{{ totalAccounts }}</span> results
        </div>

        <!-- Pagination buttons -->
        <div class="flex items-center space-x-2">
          <button 
            (click)="previousPage()" 
            [disabled]="currentPage === 1"
            class="px-3 py-1 rounded-md text-sm font-medium"
            [ngClass]="currentPage === 1 ? 'bg-gray-200 text-gray-500 cursor-not-allowed' : 'bg-white text-blue-500 hover:bg-blue-50 border border-gray-300'">
            Previous
          </button>

          <div class="flex space-x-1">
            <button *ngFor="let page of pages" 
              (click)="goToPage(page)"
              class="px-3 py-1 rounded-md text-sm font-medium"
              [ngClass]="currentPage === page ? 'bg-blue-500 text-white' : 'bg-white text-gray-500 hover:bg-blue-50 border border-gray-300'">
              {{ page }}
            </button>
          </div>

          <button 
            (click)="nextPage()" 
            [disabled]="currentPage === totalPages"
            class="px-3 py-1 rounded-md text-sm font-medium"
            [ngClass]="currentPage === totalPages ? 'bg-gray-200 text-gray-500 cursor-not-allowed' : 'bg-white text-blue-500 hover:bg-blue-50 border border-gray-300'">
            Next
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
