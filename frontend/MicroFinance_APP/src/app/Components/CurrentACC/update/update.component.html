<form [formGroup]="currentAccountForm" (ngSubmit)="onSubmit()" class="max-w-4xl mx-auto p-6 bg-white shadow-md rounded-lg">
  <h2 class="text-xl font-bold text-gray-700 mb-4">Edit Current Account</h2>

  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium text-gray-900">Max Amount</label>
      <input type="number" formControlName="maxAmount" class="w-full p-2 mt-1 border rounded-md">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-900">Min Amount</label>
      <input type="number" formControlName="minAmount" class="w-full p-2 mt-1 border rounded-md">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-900">Total Balance</label>
      <input type="number" formControlName="totalBalance" class="w-full p-2 mt-1 border rounded-md" readonly>
    </div>
  </div>

  
  
  
  <button type="submit" [disabled]="!currentAccountForm.valid" 
    class="w-full mt-6 p-3 bg-blue-500 text-white rounded-md hover:bg-blue-600">
    Update Account
  </button>
</form>
