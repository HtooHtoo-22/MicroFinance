<h2>Create Collateral Type</h2>
<form [formGroup]="collateralTypeForm" (ngSubmit)="onSubmit()">
  <div>
    <label for="name">Name:</label>
    <input type="text" id="name" formControlName="name">
    <div *ngIf="collateralTypeForm.get('name')?.invalid && collateralTypeForm.get('name')?.touched">
      Name is required.
    </div>
  </div>
  <button type="submit" [disabled]="collateralTypeForm.invalid">Create</button>
</form>
<a routerLink="/list">Back to List</a>
