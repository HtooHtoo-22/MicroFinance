<div class="container mx-auto px-4 py-8">
  <h2 class="text-2xl font-bold mb-6 text-[#00A1FF]">Rate List</h2>

  <div class="overflow-x-auto bg-white rounded-lg shadow">
    <table class="min-w-full table-auto">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rate ID</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rate Type</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Value</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let r of rates" class="hover:bg-gray-50">
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ r.id }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ r.rateType }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ r.value }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ r.status ? 'Inactive' : 'Active' }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
            <a [routerLink]="['/dashboard/update-rate', r.id]" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded-md text-sm">Edit</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
